/* Long-poll chat loop — val.town holds the connection up to ~25s and returns
   instantly when a new row lands. Reconnects immediately, so delivery feels
   push-like. Replaced setInterval polling (Devon 2026-10-23: 'as fast as telegram'). */
let _lpAborter = null;
let _lpBackoff = 500;
let _lpMaxId = 0;
async function startLongPoll(){
  stopLongPoll();
  const run = async () => {
    while(_lpAborter && !_lpAborter.signal.aborted){
      try {
        const qs = new URLSearchParams({k:KEY, action:"longpoll", room:"hq", since:String(_lpMaxId)});
        const r = await fetch(`${EP}/?${qs}`, {signal: _lpAborter.signal});
        if(!r.ok){ throw new Error("http "+r.status); }
        const j = await r.json();
        _lpBackoff = 500;
        const msgs = j.msgs || [];
        if(msgs.length){
          _lpMaxId = Math.max(_lpMaxId, ...msgs.map(m=>m.id));
          /* Merge new messages into ALLMSGS (dedup by id) + re-render */
          const seen = new Set(ALLMSGS.map(m=>m.id));
          for(const m of msgs) if(!seen.has(m.id)) ALLMSGS.push(m);
          if(ALLMSGS.length > 300) ALLMSGS = ALLMSGS.slice(-300);
          renderChatList();
          if(chatView==="conv") renderConv();
          /* Ensure scroll to bottom after new messages */
          requestAnimationFrame(()=>{
            const el=document.getElementById("msgs");
            if(el) el.scrollTop=el.scrollHeight;
            updateScrollBtn();
          });
          onNewRemoteMessages(msgs);  /* trigger push if backgrounded */
        }
      } catch(e) {
        if(e.name === "AbortError") return;
        await new Promise(r=>setTimeout(r, _lpBackoff));
        _lpBackoff = Math.min(10000, _lpBackoff*2);
      }
    }
  };
  _lpAborter = new AbortController();
  run();
}
function stopLongPoll(){ if(_lpAborter){ _lpAborter.abort(); _lpAborter=null; } }
function fastPoll(){ /* no-op kept for backward compat with old call sites — longpoll already instant */ }
async function loadChat(){
  const r = await relay("poll",{room:"hq",limit:120});
  ALLMSGS = r.msgs||[];
  if(ALLMSGS.length) _lpMaxId = Math.max(_lpMaxId, ...ALLMSGS.map(m=>m.id));
  renderChatList();
  if(chatView==="conv") renderConv();
}

/* ── resizable chat (desktop) ── edge-to-edge drag w/ snap-to-full modes.
   Pane modes: "split" (both visible), "full-alley" (chat hidden), "full-chat" (alley hidden).
   Snap thresholds: <80px → full-alley, >totalW-240 → full-chat. */
(function(){
  const saved = localStorage.getItem("ahq_chatw");
  if(saved) document.documentElement.style.setProperty("--chatw", saved+"px");
  const savedPane = localStorage.getItem("ahq_pane");
  if(savedPane) document.body.dataset.pane = savedPane;
  const d=document.getElementById("drag");
  const setPane = (w, totalW) => {
    const pane = w<80 ? "full-alley" : (w>totalW-240 ? "full-chat" : "split");
    document.body.dataset.pane = pane;
    localStorage.setItem("ahq_pane", pane);
  };
  let on=false;
  const end=()=>{ if(!on)return; on=false; d.classList.remove("on"); document.body.classList.remove("dragging");
    const w = parseInt(getComputedStyle(document.documentElement).getPropertyValue("--chatw"));
    localStorage.setItem("ahq_chatw", w);
    renderCluster(); };
  d.addEventListener("pointerdown", e=>{ e.preventDefault(); on=true; d.classList.add("on");
    document.body.classList.add("dragging"); d.setPointerCapture(e.pointerId); });
  d.addEventListener("pointermove", e=>{
    if(!on) return;
    e.preventDefault();
    const main=document.querySelector("main").getBoundingClientRect();
    const totalW = main.right - main.left;
    const raw = main.right - 22 - e.clientX;
    let w, pane;
    /* snap edges + enforce a 340px floor on the left column so the orb
       cluster doesn't crush/overlap in intermediate narrow states */
    if(raw < 80){ w = 0; pane = "full-alley"; }
    else if(raw > totalW - 240){ w = totalW - 60; pane = "full-chat"; }
    else { w = Math.min(totalW - 340, raw); pane = "split"; }
    document.documentElement.style.setProperty("--chatw", w+"px");
    document.body.dataset.pane = pane;
    localStorage.setItem("ahq_pane", pane);
  });
  d.addEventListener("pointerup", end);
  d.addEventListener("pointercancel", end);
  d.addEventListener("lostpointercapture", end);
  /* double-click / double-tap resets to default split width */
  let lastTap=0;
  d.addEventListener("pointerdown", ()=>{ const t=Date.now();
    if(t-lastTap<350){ document.documentElement.style.setProperty("--chatw","350px");
      document.body.dataset.pane = "split";
      localStorage.removeItem("ahq_chatw"); localStorage.setItem("ahq_pane","split");
      renderCluster(); }
    lastTap=t; });
})();

/* ── Task drag between pills — pointer-based (works mouse, trackpad, touch).

   One handler works everywhere. ── */
let _tDragId=null, _tDragFromLid=null, _tDragRow=null, _tDragStart=null, _tDragPreview=null, _tDragArmed=false, _tDragTimer=null;
function _tDragGhost(title){
  const g = document.createElement("div");
  g.className = "tkghost";
  g.textContent = title;
  g.style.position = "fixed"; g.style.left="-9999px"; g.style.top="-9999px";

function _tDragActivate(ev){

function _tDragUpdatePreview(x, y){

}
function _tDragFindPill(x, y){

function _tDragHighlight(pill){

}
function _tDragReset(){

  document.querySelectorAll(".tpill.drophot").forEach(p=>p.classList.remove("drophot"));
  document.body.classList.remove("tk-dragging");

function _tDragOnDown(ev){

  const t = TROWS[ri]; if(!t || !t.id) return;

function _tDragOnMove(ev){

}

/* Compute an RFC3339 due date for the pill we're dropping on.
   Today → today, Tomorrow → tomorrow, Week → coming Sunday, Month → end of month, Someday → clear.
   This way "drop on Tomorrow" also sets due=tomorrow so the Daily Dragons sync picks it up at 5am. */
function _dueForPill(pillKey){
  const d = new Date(); d.setHours(0,0,0,0);
  const toISO = x => x.toISOString().replace(/\.\d{3}Z$/, ".000Z");
  if(pillKey==="today") return toISO(d);
  if(pillKey==="tomorrow"){ d.setDate(d.getDate()+1); return toISO(d); }
  if(pillKey==="week"){ /* this Sunday or next if today is Sunday */
    const dow = d.getDay(); const add = dow===0 ? 7 : (7 - dow);
    d.setDate(d.getDate()+add); return toISO(d);
  }
  if(pillKey==="month"){ /* last day of this month */
    const nxt = new Date(d.getFullYear(), d.getMonth()+1, 0); return toISO(nxt);
  }
  if(pillKey==="some") return "";  /* empty string clears due */
  return undefined;  /* unknown → leave untouched */
}
function tDrop(ev, pillKey){
  ev.preventDefault();

  if(!id) return;
  const def = TPILLS.find(p=>p[0]===pillKey); if(!def) return;
  const toLid = DQLISTS[def[3]];
  if(!toLid) return;
  const t = TROWS.find(x=>x.id===id);
  const due = _dueForPill(pillKey);
  if(toLid === fromLid){
    /* Same list — just update the due date in place (useful when dragging within Today etc) */
    if(due !== undefined){
      dq("taskedit",{id, lid:fromLid, title: t?t.title:"", due});
      _askToast("due date updated");
      renderTasks();
    }
    return;
  }
  dq("taskmove",{id, lid:fromLid, to:toLid, title: t?t.title:"", due});
  tpAdd(id, {gone:true});
  _askToast("moved to " + def[2]);
  renderTasks();
}

async function dismissAlert(id, ev){ if(ev){ ev.stopPropagation(); ev.preventDefault(); }

  ALERTS=ALERTS.filter(a=>String(a.id)!==idStr); renderAlerts();

/* Icon per kind — compact emoji that still reads at pill-chip size */
const AL_ICONS = {sales:"📉", ads:"🎯", cs:"💬", cron:"⚙", api:"🔌", infra:"⚡", approval:"✓", timer:"⏰", did:"🤖", info:"·"};
function _alIcon(k){ return AL_ICONS[k] || AL_ICONS.info; }
function renderAlerts(){
  const bar=document.getElementById("alertbar");
  const now=Date.now()/1000;
  const fired=JSON.parse(localStorage.getItem("ahq_fired")||"{}");
  const chips=[];
  for(const a of ALERTS){
    /* Timer-style alarms (set via hq_lib add_alert) */
    if(a.type==="timer" && a.fire_at){
      const left=a.fire_at-now;
      if(left < -600) continue;
      if(left<=600 && !fired["w"+a.id]){ fired["w"+a.id]=1; beep(); notify(`10 min — ${a.label}`); }
      if(left<=0 && !fired["f"+a.id]){ fired["f"+a.id]=1; beep(); setTimeout(beep,450); setTimeout(beep,900); notify(`⏰ ${a.label}`); }
      chips.push({cls:"timer"+(left<=600?" soon":""), ico:_alIcon("timer"),
        text:`${esc(a.label)} <span class="cnt">${left<=0?"now":fmtLeft(left)}</span>`,
        onclick:`dismissAlert(${a.id})`});
      continue;
    }
    /* Watchlist alerts (passive monitor cron writes severity + kind) */
    const sev = (a.severity || "info").toLowerCase();
    const kind = (a.kind || a.type || "info").toLowerCase();
    const cls = sev==="critical" ? "critical" : sev==="warn" ? "warn" : sev==="did" ? "did" : a.type==="approval" ? "approval" : "info";
    const ico = _alIcon(kind in AL_ICONS ? kind : (cls==="critical"?"infra":"info"));
    const title = esc(a.title || a.label || "alert");
    const detail = a.detail ? `<small style="color:var(--faint);font-weight:500;margin-left:4px">${esc(a.detail).slice(0,60)}</small>` : "";
    const go = a.action_url ? `window.location.href='${esc(a.action_url)}'` : a.project_id ? `openProjectChat(${a.project_id})` : "setTab('alley')";
    chips.push({cls, ico, text: title+detail, onclick: go, id: a.id});
  }
  /* Ready-for-approval jobs become approval chips */
  for(const j of LASTJOBS.filter(j=>j.stage==="ready")){
    const go = j.project_id?`openProjectChat(${j.project_id})`:"setTab('alley')";
    chips.push({cls:"approval", ico:_alIcon("approval"), text:esc(j.title), onclick:go});
  }
  /* Sort: critical first, then warn, then timer-soon, then rest */
  const prio = {critical:0, warn:1, timer:2, approval:3, did:4, info:5};
  chips.sort((a,b) => (prio[a.cls.split(" ")[0]]||9) - (prio[b.cls.split(" ")[0]]||9));
  localStorage.setItem("ahq_fired", JSON.stringify(fired));
  const vis = chips.slice(0,5);
  bar.innerHTML = vis.map(c=>
    `<div class="al ${c.cls}" ${c.onclick?`onclick="${c.onclick}"`:""}>
      <span class="ic">${c.ico}</span>${c.text}${c.id?`<span class="x" onclick="dismissAlert('${esc(String(c.id))}',event); return false" title="Dismiss">✕</span>`:""}
    </div>`
  ).join("");
  bar.classList.toggle("on", vis.length>0);
  if(ALERTS.some(a=>a.type==="timer") && ("Notification" in window) && Notification.permission==="default")
    Notification.requestPermission();
}
setInterval(()=>{ if(ALERTS.some(a=>a.type==="timer")) renderAlerts(); }, 1000);

let NOTIF_OPEN=false, DECISIONS=[], NOTIF_SEEN = +(localStorage.getItem("ahq_notif_seen")||"0");
function toggleNotif(){
  NOTIF_OPEN=!NOTIF_OPEN;
  document.getElementById("notifpanel").classList.toggle("off", !NOTIF_OPEN);
  document.getElementById("notifscrim").classList.toggle("off", !NOTIF_OPEN);
  if(NOTIF_OPEN){
    const lastTs = DECISIONS.length ? new Date(DECISIONS[0].ts).getTime() : Date.now();
    NOTIF_SEEN = Math.max(NOTIF_SEEN, lastTs);
    localStorage.setItem("ahq_notif_seen", String(NOTIF_SEEN));
    renderBellBadge();
    renderNotif();
  }
}
function renderBellBadge(){
  const b = document.getElementById("bellbadge");
  const unread = DECISIONS.filter(d=>new Date(d.ts).getTime() > NOTIF_SEEN).length;
  if(unread>0){ b.style.display="flex"; b.textContent = unread>99?"99+":unread; }
  else b.style.display="none";
}
function _recapLine(l){
  const done = l.startsWith("✓"), stuck = l.startsWith("⚠");
  const ico = done?"✓":stuck?"⚠":"→"; const cls = done?"done":stuck?"stuck":"mov";
  /* strip the trailing "— status" phrase (approved / in progress / queued) — the icon already encodes it */
  const txt = l.replace(/^[✓⚠→\s]+/,"").replace(/\s—\s(approved|in progress|queued|ready|working|checking)\s*$/i,"");
  return `<div class="rline ${cls}" title="${esc(txt)}"><span class="rico">${ico}</span><span class="rtxt">${esc(txt)}</span></div>`;
}
function _recapCard(r){
  if(!r || !r.lines) return `<div class="nempty">no recap yet</div>`;
  const c=r.counts||{};
  const chips = `<div class="rchips">
    <span class="rchip2 done"><b>${c.done||0}</b> ✓</span>
    <span class="rchip2 mov"><b>${c.moved||0}</b> ↻</span>
    ${c.stuck?`<span class="rchip2 stuck"><b>${c.stuck}</b> ⚠</span>`:""}
    ${r.goals!=null?`<span class="rchip2">goals <b>${r.goals}%</b></span>`:""}
  </div>`;
  return `<div class="ncard"><div class="nct">Recap <small style="color:var(--faint);font-weight:400;margin-left:4px">${esc(r.date||"")}</small></div>${chips}${r.lines.map(_recapLine).join("")}</div>`;
}
function _alertsBlock(){
  if(!ALERTS || !ALERTS.length) return `<div class="nempty">no active alerts</div>`;
  const head = `<div class="nctl"><button class="nclrall" onclick="dismissAllAlerts()">Clear all</button></div>`;
  return head + ALERTS.map(a=>{
    const idAttr = a.id!=null ? `data-aid="${esc(String(a.id))}"` : "";
    const x = a.id!=null ? `<span class="ncardx" onclick="dismissAlert('${esc(String(a.id))}',event)" title="Dismiss">✕</span>` : "";
    return `<div class="ncard" ${idAttr}>${x}<div class="nct">${esc(a.title||a.kind||"Alert")}</div>${a.detail?`<div class="ncd">${esc(a.detail)}</div>`:""}${a.ts?`<div class="ncm">${esc(ago(a.ts))}</div>`:""}</div>`;
  }).join("");
}
async function dismissAllAlerts(){
  const ids = ALERTS.filter(a=>a.id!=null).map(a=>String(a.id));
  if(!ids.length) return;
  ALERTS = ALERTS.filter(a=>a.id==null);
  renderAlerts(); if(NOTIF_OPEN) renderNotif();
  try{ await relay("kvset",{},{key:"alerts",value:ALERTS}); }catch(e){}
}
function _dlogBlock(){
  if(!DECISIONS || !DECISIONS.length) return `<div class="nempty">decision log empty — autonomous calls will stream here</div>`;
  return `<div class="dlog">`+DECISIONS.slice(0,40).map(d=>
    `<div class="drow"><span class="dag">${esc(d.agent||"emma")}</span><span class="dac">${esc(d.action||"")}${d.target?` <em>→ ${esc(d.target)}</em>`:""}${d.reason?`<br><em style="font-size:11px">${esc(d.reason)}</em>`:""}</span><span class="dt">${esc(ago(d.ts))}</span></div>`
  ).join("")+`</div>`;
}
function renderNotif(){
  const el = document.getElementById("nbody");
  const recap = window._lastRecap || null;
  el.innerHTML =
    `<div><div class="nsec">Nightly recap</div>${_recapCard(recap)}</div>`+
    `<div><div class="nsec">Alerts</div>${_alertsBlock()}</div>`+
    `<div><div class="nsec">Decision log</div>${_dlogBlock()}</div>`;
}

/* ── Voice input (Web Speech API, native, no backend). Hold-to-talk UX. ── */
(function initVoice(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const mic = document.getElementById("askmic"); const inp = document.getElementById("askin");
  if(!SR){ mic.style.display="none"; return; }
  let rec = null, active=false, baseText="";
  const start = ()=>{
    if(active) return;
    try{
      rec = new SR(); rec.lang="en-US"; rec.continuous=true; rec.interimResults=true;
      baseText = inp.value;
      rec.onresult = (ev)=>{
        let fin="", intr="";
        for(let i=ev.resultIndex;i<ev.results.length;i++){
          const r=ev.results[i];
          if(r.isFinal) fin+=r[0].transcript; else intr+=r[0].transcript;
        }
        inp.value = (baseText + (baseText && (fin||intr) ? " " : "") + fin + intr).replace(/\s+/g," ").trim();
      };
      rec.onend = ()=>{ if(active) try{rec.start()}catch(e){} };
      rec.onerror = (e)=>{ _askToast("mic: "+e.error); stop(); };
      rec.start(); active=true; mic.classList.add("on");
    } catch(e){ _askToast("mic unavailable"); }
  };
  const stop = ()=>{ active=false; mic.classList.remove("on"); if(rec) try{rec.stop()}catch(e){} inp.focus(); };
  mic.addEventListener("pointerdown", e=>{ e.preventDefault(); start(); });
  mic.addEventListener("pointerup", stop);
  mic.addEventListener("pointercancel", stop);
  mic.addEventListener("pointerleave", ()=>{ if(active) stop(); });
})();

/* ── Pan the orb cluster (mouse drag / touch drag) ──
   Devon's rule 2026-10-23: hold the background and drag the cluster around.
   Double-tap or double-click = reset to center. Works on desktop + touchpad + tablet. */
(function initClusterPan(){
  const cont = document.getElementById("cluster");
  const nodes = document.getElementById("cnodes");
  const lines = document.getElementById("clines");
  if(!cont || !nodes) return;
  let panX = 0, panY = 0, startX = 0, startY = 0, baseX = 0, baseY = 0;
  let panning = false, pointerId = null, startedOnHub = false, hubTapTime = 0;
  const apply = ()=>{
    const t = `translate(${panX}px, ${panY}px)`;
    nodes.style.transform = t; lines.style.transform = t;
  };
  const reset = ()=>{ panX = 0; panY = 0; apply(); };
  /* Devon's rule 2026-10-23: pan ONLY when grabbing Emma (the center hub).
     Background taps/scrolls pass through normally so page scroll works.
     Short tap on Emma still fires her onclick (open chat); only sustained drag pans. */
  cont.addEventListener("pointerdown", (e)=>{
    const hubEl = e.target.closest(".cnode.hub");
    if(!hubEl) return;  // background/other orbs — don't capture, let scroll + click work normally
    startedOnHub = true;
    hubTapTime = Date.now();
    pointerId = e.pointerId;
    startX = e.clientX; startY = e.clientY; baseX = panX; baseY = panY;
    panning = false;  // not yet — only activate once movement exceeds threshold
  }, {passive:true});
  cont.addEventListener("pointermove", (e)=>{
    if(!startedOnHub || e.pointerId !== pointerId) return;
    const dx = e.clientX - startX, dy = e.clientY - startY;
    const dist = Math.hypot(dx, dy);
    if(!panning && dist < 6) return;  // under threshold = still a potential tap/click
    if(!panning){
      panning = true;
      cont.classList.add("panning");
      try{ cont.setPointerCapture(e.pointerId); }catch(_){}
    }
    panX = baseX + dx; panY = baseY + dy;
    apply();
    if(e.cancelable) e.preventDefault();
  });
  const endPan = ()=>{
    if(panning){
      panning = false;
      cont.classList.remove("panning");
    }
    startedOnHub = false;
    pointerId = null;
  };
  cont.addEventListener("pointerup", endPan);
  cont.addEventListener("pointercancel", endPan);
  /* double-tap on Emma = recenter */
  let lastTap = 0;
  cont.addEventListener("pointerdown", (e)=>{
    if(!e.target.closest(".cnode.hub")) return;
    const t = Date.now();
    if(t - lastTap < 320){ reset(); }
    lastTap = t;
  }, {passive:true});
})();

/* ── Chat text zoom (wheel + pinch) ──
   Scroll wheel on #msgs with ctrl held OR pinch on touchpad/tablet = zoom chat font size.
   Range 11-22px. Persisted in localStorage. Double-tap reset. */
(function initChatZoom(){
  const msgs = document.getElementById("msgs");
  if(!msgs) return;
  let fs = parseFloat(localStorage.getItem("ahq_chat_fs")) || 13;
  const apply = ()=>{
    msgs.style.fontSize = fs + "px";
    document.querySelectorAll("#msgs .msg").forEach(m=>m.style.fontSize = fs + "px");
  };
  apply();
  const save = ()=>localStorage.setItem("ahq_chat_fs", String(fs));
  const bump = (delta)=>{ fs = Math.max(11, Math.min(22, fs + delta)); apply(); save(); };
  /* Wheel zoom — ctrl+wheel or just wheel inside msgs (prevents page scroll conflict) */
  msgs.addEventListener("wheel", (e)=>{
    if(!(e.ctrlKey || e.metaKey)) return;
    e.preventDefault();
    bump(e.deltaY < 0 ? 0.5 : -0.5);
  }, {passive:false});
  /* Pinch zoom (touch / tablet) — two-finger pinch inside msgs */
  let pinchStartDist = 0, pinchStartFs = fs;
  msgs.addEventListener("touchstart", (e)=>{
    if(e.touches.length === 2){
      const dx = e.touches[0].clientX - e.touches[1].clientX;
      const dy = e.touches[0].clientY - e.touches[1].clientY;
      pinchStartDist = Math.hypot(dx, dy);
      pinchStartFs = fs;
    }
  }, {passive:true});
  msgs.addEventListener("touchmove", (e)=>{
    if(e.touches.length !== 2 || !pinchStartDist) return;
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    const d = Math.hypot(dx, dy);
    fs = Math.max(11, Math.min(22, pinchStartFs * (d / pinchStartDist)));
    apply();
    e.preventDefault();
  }, {passive:false});
  msgs.addEventListener("touchend", ()=>{ if(pinchStartDist){ save(); pinchStartDist = 0; } });
})();

/* ── Morning / Night update modal ──
   Pops over the dashboard on first open of the day inside the window.
   Morning (6-10am): plan the day — events, dragons, pin-of-day, note from Emma.
   Night (8-11:30pm): reflect — today's recap, tomorrow's events, pin for tomorrow.
   Dismiss state per calendar date in localStorage. Also tap-to-open anytime
   from the Personal hub buttons. */
function _duTodayKey(mode){ const d=new Date(); return `ahq_du_${mode}_${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`; }
function _duSeen(mode){ return !!localStorage.getItem(_duTodayKey(mode)); }
function _duMarkSeen(mode){ localStorage.setItem(_duTodayKey(mode), String(Date.now())); }
function _duNow(){ return new Date(); }
function _duMode(){
  const h = _duNow().getHours();
  if(h>=6 && h<10) return "morn";
  /* Devon's rule 2026-10-23: night = HE opens it manually (SAGE button).
     Auto-pop only kicks in if he hasn't done it by 11pm — then on next sign-in
     between 23:00 and 04:00 (covers late-night + early-morning catch-up). */
  if(h>=23 || h<4) return "night";
  return null;
}
/* DHQ layout, dashboard look — matches Devon's morning.html/night.html order of sections
   but renders in Agent Alley's native dark chrome. Pulls DHQ relay kv for mantras + pin. */
const DQ_RELAY = DQEP, DQ_KEY = DQK;
async function _dqKvGet(key){
  try{
    const r = await fetch(`${DQ_RELAY}/?k=${DQ_KEY}&action=kvget&key=${encodeURIComponent(key)}`);
    const j = await r.json(); return j.value;
  }catch(e){ return null; }
}
async function _dqKvSet(key, value){
  try{
    await fetch(`${DQ_RELAY}/?k=${DQ_KEY}&action=kvset`,
      {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({key, value})});
    return true;
  }catch(e){ return false; }
}
/* Set/clear a daily habit mark through DHQ relay. Day is YYYY-MM-DD. done=0/1.
   Writes to the same habits table render.py reads from, so goals toggled here
   show up in the morning/night cards automatically. */
async function _dqHabitSet(day, habit, done){
  /* Returns true on 2xx, false on network error or non-ok response. Callers that need
     revert-on-failure (e.g. _gCycleHabit) should check the boolean, not try/catch. */
  try{
    const r = await fetch(`${DQ_RELAY}/?k=${DQ_KEY}&action=habitset`,
      {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({day, habit, done:done?1:0})});
    return r.ok;
  }catch(e){ return false; }
}
async function _dqHabitRange(start, end){
  try{
    const r = await fetch(`${DQ_RELAY}/?k=${DQ_KEY}&action=habitrange&start=${start}&end=${end}`);
    const j = await r.json(); return (j.rows || []);
  }catch(e){ return []; }
}

function closeDayUpdate(){

async function renderDayUpdate(mode){
  const w = document.getElementById("duscroll");
  const now = _duNow();
  const dateLbl = now.toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"});
  const td = TASKS && TASKS.today;
  const up = TASKS && TASKS.upcoming || [];
  const dragons = (TASKS && TASKS.tabs && TASKS.tabs.today) || [];
  const pinLocal = localStorage.getItem("ahq_dayfocus") || "";
  const recap = window._lastRecap || null;
  /* Hide events that have already passed — Devon only wants to see what's ahead. */
  const _toMin = (t) => {
    const m = String(t||"").trim().match(/^(\d{1,2}):?(\d{2})?\s*([aApP])?/);
    if(!m) return null;
    let h = parseInt(m[1]||"0"), mn = parseInt(m[2]||"0");
    const ap = (m[3]||"").toLowerCase();
    if(ap === "p" && h !== 12) h += 12;
    if(ap === "a" && h === 12) h = 0;
    return h*60 + mn;
  };
  const nowMin = now.getHours()*60 + now.getMinutes();
  const _upcoming = e => { const em = _toMin(e.time); return em==null || em >= nowMin; };
  const liveEvents = (td && td.events || []).filter(e=>!e.all_day && _upcoming(e));
  const alldayEvents = (td && td.events || []).filter(e=>e.all_day && e.title && e.title.trim());
  /* Shell render first so the modal appears instantly, DHQ data fills in */
  const ig = mode==="morn" ? "igA" : "igV";  /* amber/violet dashboard gradients */
  const sections = [];
  /* Hero — SVG star inside a dashboard orb (matches CoS cluster chrome) */
  sections.push(`<div class="duhero"><div class="duorb">${icon("star", ig)}</div><div><h1>${mode==="morn"?"Morning":"Night"}</h1><div class="dudate">${esc(dateLbl)}</div></div></div>`);
  /* Pin / Today's #1 — uses dashboard "star" icon */
  const pinLabel = mode==="morn" ? "TODAY'S #1" : "TOMORROW'S #1";
  sections.push(`<div class="dusec pin"><div class="duk">${icon("star", ig)} ${pinLabel}</div><input class="dupininp" id="dupininp" placeholder="${mode==="morn"?"what matters most today?":"what will matter tomorrow?"}" value="${esc(pinLocal)}" oninput="_duPinSave(event)"></div>`);
  /* Reminders */
  sections.push(`<div class="dusec" id="duremind"><div class="duk">${icon("life_ops", ig)} REMINDERS</div><div class="duempty">loading…</div></div>`);
  /* All-day events (morning only, if any) */
  if(mode==="morn" && alldayEvents.length){
    sections.push(`<div class="dusec"><div class="duk">${icon("life_ops","igG")} ALL DAY</div>${alldayEvents.map(e=>`<div class="duempty" style="color:var(--txt);font-weight:600;padding:4px 2px">${esc(e.title)}</div>`).join("")}</div>`);
  }
  /* Calendar — Today (morning) or Tomorrow (night) */
  if(mode==="morn"){
    sections.push(`<div class="dusec"><div class="duk">${icon("life_ops","igG")} TODAY</div>${liveEvents.length ? liveEvents.map(e=>`<div class="duevrow"><span class="duevt">${esc(e.time)}</span><span class="duevn">${esc(e.title)}</span></div>`).join("") : `<div class="duempty">nothing scheduled</div>`}</div>`);
    sections.push(`<div class="dusec"><div class="duk">${icon("star","igA")} WAKE ANCHOR</div><div class="duwake"><button class="duwakebtn" onclick="_duWakeConfirm(this)">I'm up</button><div class="dunote">10 min outside before 9am · same wake time beats more sleep</div></div></div>`);
  } else {
    /* Night: show events STILL AHEAD today (e.g. 6pm dinner when viewed at 5pm) + tomorrow + day-after */
    if(liveEvents.length){
      sections.push(`<div class="dusec"><div class="duk">${icon("life_ops","igG")} LATER TODAY</div>${liveEvents.map(e=>`<div class="duevrow"><span class="duevt">${esc(e.time)}</span><span class="duevn">${esc(e.title)}</span></div>`).join("")}</div>`);
    }
    const tomEvs = up.length ? (up[0].events || []).filter(e=>!e.all_day) : [];
    const tomLbl = up.length ? (up[0].label || "tomorrow") : "tomorrow";
    sections.push(`<div class="dusec"><div class="duk">${icon("life_ops","igC")} TOMORROW <small>${esc(tomLbl)}</small></div>${tomEvs.length ? tomEvs.map(e=>`<div class="duevrow"><span class="duevt">${esc(e.time)}</span><span class="duevn">${esc(e.title)}</span></div>`).join("") : `<div class="duempty">tomorrow is clear</div>`}</div>`);
    /* day-after preview (if any) */
    if(up.length > 1){
      const d2Evs = (up[1].events || []).filter(e=>!e.all_day);
      if(d2Evs.length){
        sections.push(`<div class="dusec"><div class="duk">${icon("life_ops","igC")} ${esc((up[1].label||"day after").toUpperCase())}</div>${d2Evs.map(e=>`<div class="duevrow"><span class="duevt">${esc(e.time)}</span><span class="duevn">${esc(e.title)}</span></div>`).join("")}</div>`);
      }
    }
  }
  /* Daily Dragons */
  sections.push(`<div class="dusec"><div class="duk">${icon("star", ig)} DAILY DRAGONS${dragons.length?`<small>${dragons.length} to slay</small>`:""}</div>${dragons.length ? dragons.slice(0,10).map(t=>{
    const done = (TPEND[t.id]||{}).done != null ? TPEND[t.id].done : false;
    const star = (TPEND[t.id]||{}).star != null ? TPEND[t.id].star : !!t.star;
    return `<div class="duddrow ${done?"ck":""}"><span class="duddchk">${done?"✓":""}</span><span class="duddt">${esc(t.title)}</span>${star?`<span class="dustar">★</span>`:""}</div>`;
  }).join("") : `<div class="duempty">nothing starred for today</div>`}</div>`);
  /* Habits — flat list of every goal item across all categories, tappable circle per row.
     Shell renders empty; _loadDayUpdateHabits() fills it async (uses GOALS_STATE if primed,
     else fetches goals2 + today's habit marks). State is shared with Goals tab + render.py. */
  sections.push(`<div class="dusec"><div class="duk">${icon("star", ig)} HABITS</div><div id="duhabits"><div class="duempty">loading habits…</div></div></div>`);
  /* Night-only: recap */
  if(mode==="night"){
    const c = (recap && recap.counts) || {};
    sections.push(`<div class="dusec"><div class="duk">${icon("star","igV")} TODAY'S RECAP</div><div class="duchips"><span class="duchip done"><b>${c.done||0}</b> ✓</span><span class="duchip mov"><b>${c.moved||0}</b> ↻</span>${c.stuck?`<span class="duchip wrn"><b>${c.stuck}</b> ⚠</span>`:""}${recap && recap.goals!=null?`<span class="duchip">goals <b>${recap.goals}%</b></span>`:""}</div>${recap && recap.lines ? recap.lines.slice(0,8).map(l=>{
      const done = l.startsWith("✓"), stuck = l.startsWith("⚠");
      const ico = done?"✓":stuck?"⚠":"→"; const cls = done?"done":stuck?"stuck":"mov";
      const txt = l.replace(/^[✓⚠→\s]+/,"").replace(/\s—\s(approved|in progress|queued|ready|working|checking)\s*$/i,"");
      return `<div class="durline ${cls}"><span class="durico">${ico}</span><span class="durtxt">${esc(txt)}</span></div>`;
    }).join("") : `<div class="duempty">no recap yet · nightly job runs at 9:15pm</div>`}</div>`);
  }
  w.innerHTML = sections.join("");
  /* Fill reminders async from DHQ kv */
  const mantras = await _dqKvGet("mantras");
  const rem = document.getElementById("duremind");
  if(rem){
    const ig = mode==="morn" ? "igA" : "igV";
    if(Array.isArray(mantras) && mantras.length){
      /* DHQ mantra format: {t: text, c: color, b: bg} — drop DHQ colors, use dashboard chrome */
      rem.innerHTML = `<div class="duk">${icon("life_ops", ig)} REMINDERS</div>` + mantras.map(m=>{
        const t = typeof m==="string" ? m : (m.t || m.text || "");
        return t ? `<div class="dumantra">${esc(t)}</div>` : "";
      }).join("");
    } else {
      rem.innerHTML = `<div class="duk">${icon("life_ops", ig)} REMINDERS</div><div class="duempty">no reminders set</div>`;
    }
  }
  /* Fill habits async — flat list of every goal item, tap circle to cycle state. */
  _loadDayUpdateHabits();
}
function _duWakeConfirm(btn){ btn.textContent = "☀️ nice — you're up"; btn.style.opacity="0.6"; btn.disabled=true; }

/* Load goal defs + today's habit marks if not already in GOALS_STATE, then render habits
   section of the day-update modal. State is shared with Goals tab so taps sync both ways. */
async function _loadDayUpdateHabits(){
  const host = document.getElementById("duhabits");
  if(!host) return;
  if(!GOALS_STATE.defs){
    /* Need defs + at least today's hits so done-circles reflect reality. */
    const now = new Date();
    const start = new Date(now); start.setDate(now.getDate() - 7);
    const [defs, rows] = await Promise.all([
      _dqKvGet("goals2"),
      _dqHabitRange(_gIso(start), _gIso(now))
    ]);
    GOALS_STATE.defs = defs || { cats: [] };
    (rows || []).forEach(r => {
      if(!r.done) return;
      if(r.habit && (r.habit.indexOf("G.")===0 || r.habit.indexOf("S.")===0)){
        GOALS_STATE.days[r.day] = GOALS_STATE.days[r.day] || {};
        GOALS_STATE.days[r.day][r.habit] = 1;
      }
    });
  }
  _rerenderDayUpdateHabits();
}

/* Repaint ONLY the modal habits list. Called optimistically from _gCycleHabit on tap,
   so morning/night modal + Goals tab stay in sync without triggering a modal rebuild. */
function _rerenderDayUpdateHabits(){
  const host = document.getElementById("duhabits");
  if(!host) return;
  const cats = (GOALS_STATE.defs && GOALS_STATE.defs.cats) || [];
  const today = _gToday();
  /* Flatten: show every required item across every category, cat icon prefix. */
  const rows = [];
  cats.forEach(cat => {
    (cat.items||[]).forEach(it => {
      if(it.opt) return;  /* skip optional/lag items — habits = required dominoes only */
      rows.push({cat, it});
    });
  });
  if(!rows.length){
    host.innerHTML = `<div class="duempty">no goals set — add some in the Goals tab</div>`;
    return;
  }
  host.innerHTML = rows.map(({cat, it}) => {
    const done = _gIsDone(cat.id, it.id, today);
    const skip = _gIsSkip(cat.id, it.id, today);
    const state = done ? "done" : (skip ? "skip" : "");
    const mark = done ? "✓" : (skip ? "s" : "");
    return `<div class="duhrow ${state}" data-c="${esc(cat.id)}" data-i="${esc(it.id)}">
      <span class="duhchk">${mark}</span>
      <span class="duhic">${esc(cat.icon||"🎯")}</span>
      <span class="duht">${esc(it.name||it.id)}</span>
    </div>`;
  }).join("");
  /* Wire taps — same 3-state cycle as heatmap, same optimistic UX. */
  host.querySelectorAll(".duhrow").forEach(el => {
    el.onclick = async () => {
      const cid = el.getAttribute("data-c"), iid = el.getAttribute("data-i");
      await _gCycleHabit(cid, iid, _gToday(), /*cycleFull=*/true);
    };
  });
}

/* ── Goals tab (DHQ goals2 kv — full feature parity with render.py's night-goals widget)
   Writes go to the same keys render.py uses (G.{cid}.{iid}, S.{cid}.{iid}) so toggles here
   show up in Devon's morning.html + night.html automatically. Dashboard chrome only (no DHQ
   pink/purple pastels). Devon 2026-10-23 asked for proper rebuild, not static placeholders. */
const GOALS_STATE = { defs:null, days:{}, openCat:null, openItemCal:{}, openNote:null };

/* Local-date helpers. ISO in local tz, matches render.py's `iso()`. */
function _gIso(d){ return d.toLocaleDateString("en-CA"); }
function _gToday(){ return _gIso(new Date()); }
function _gMonday(d){ const m=new Date(d); m.setDate(d.getDate() - ((d.getDay()+6)%7)); m.setHours(0,0,0,0); return m; }
function _gAddD(k, n){ const d=new Date(k+"T12:00:00"); d.setDate(d.getDate()+n); return _gIso(d); }
function _gk(c, i){ return "G." + c + "." + i; }
function _gskk(c, i){ return "S." + c + "." + i; }
function _gIsSkip(c, i, k){ const row = GOALS_STATE.days[k]; return !!(row && row[_gskk(c,i)]); }
function _gIsDone(c, i, k){ const row = GOALS_STATE.days[k]; return !!(row && row[_gk(c,i)]); }

/* Shared habit-cycle helper used by Goals tab (cell + item circle) AND modal habits list.
   cycleFull=true → 3-state (empty → done → skip → clear). cycleFull=false → 2-state (empty⇄done).
   Optimistic UX: update local state + redraw IMMEDIATELY, then POST. On error, revert + redraw. */
async function _gCycleHabit(cid, iid, dd, cycleFull){
  const K1 = _gk(cid, iid), K2 = _gskk(cid, iid);
  GOALS_STATE.days[dd] = GOALS_STATE.days[dd] || {};
  const row = GOALS_STATE.days[dd];
  const prev = { K1: row[K1] || 0, K2: row[K2] || 0 };
  const writes = []; /* [{habit, done}] queued for network */

  if(row[K1]){
    /* currently done */
    if(cycleFull){
      /* done → skip. Block two-in-a-row skips (render.py line 959). */
      if(_gIsSkip(cid, iid, _gAddD(dd, -1)) || _gIsSkip(cid, iid, _gAddD(dd, 1))){
        alert("Can't skip two days in a row — day before or after is already skipped.");
        row[K1] = 0;
        writes.push({habit:K1, done:0});
      } else {
        row[K1] = 0; row[K2] = 1;
        writes.push({habit:K1, done:0}, {habit:K2, done:1});
      }
    } else {
      /* 2-state: done → empty */
      row[K1] = 0;
      writes.push({habit:K1, done:0});
    }
  } else if(row[K2] && cycleFull){
    /* skip → clear (only in full cycle) */
    row[K2] = 0;
    writes.push({habit:K2, done:0});
  } else {
    /* empty → done (clear any lingering skip too in 2-state mode) */
    if(!cycleFull && row[K2]){ row[K2] = 0; writes.push({habit:K2, done:0}); }
    row[K1] = 1;
    writes.push({habit:K1, done:1});
  }

  /* Optimistic repaint — Goals tab + both modals share the same state. */
  _gDraw();
  _rerenderDayUpdateHabits();

  const results = await Promise.all(writes.map(w => _dqHabitSet(dd, w.habit, w.done)));
  if(results.some(ok => !ok)){
    row[K1] = prev.K1; row[K2] = prev.K2;
    _gDraw(); _rerenderDayUpdateHabits();
    toast("save failed — reverted");
  }
}

/* Period = this week (Mon–Sun) by default, or this month if per==="mo". */
function _gPeriod(it){
  const now = new Date();
  if(it.per === "mo"){
    const first = new Date(now.getFullYear(), now.getMonth(), 1);
    const last = new Date(now.getFullYear(), now.getMonth()+1, 0);
    return { start:first, len:last.getDate() };
  }
  return { start:_gMonday(now), len:7 };
}
function _gWeekHits(cid, it){
  const p = _gPeriod(it); const now = new Date(); let n = 0;
  for(let d = new Date(p.start); d <= now; d.setDate(d.getDate()+1)){
    if(_gIsDone(cid, it.id, _gIso(d))) n++;
  }
  return n;
}
/* Days elapsed in current period (inclusive of today). Mon=1 … Sun=7 for weekly. */
function _gDaysElapsed(it){
  const p = _gPeriod(it); const now = new Date();
  const start = new Date(p.start); start.setHours(0,0,0,0);
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  return Math.min(p.len, Math.max(1, Math.floor((today - start) / 86400000) + 1));
}
/* "Start at 100%" formula (Devon 2026-10-23): Devon doesn't want red % on fresh weeks.
   Instead of hits/min, we check: given remaining days this period, can he still hit the
   target? If yes → 100%. If no → actual hits/min %. This keeps the week green until it's
   mathematically impossible, then shows the real gap. Mirrors "it's not a miss until you
   can't recover" — no guilt-trip for Monday morning with 0 hits on a 3/wk goal. */
function _gItemPct(cid, it){
  const m = it.min || 1, hits = _gWeekHits(cid, it);
  if(hits >= m) return 100;
  const elapsed = _gDaysElapsed(it);
  const p = _gPeriod(it);
  const daysLeft = p.len - elapsed;         /* days still available after today */
  const needed = m - hits;                   /* hits still needed to reach min */
  if(needed <= daysLeft + 1) return 100;    /* still on track incl. today; +1 = today also countable */
  /* Can't recover — show real gap against proration to-date */
  return Math.round(hits * 100 / m);
}
function _gCatPct(cat){
  const req = (cat.items||[]).filter(it => !it.opt);
  if(!req.length) return 100;
  let s = 0;
  req.forEach(it => { s += Math.min(100, _gItemPct(cat.id, it)); });
  return Math.round(s / req.length);
}
function _gVerdictCls(pct){ if(pct>=80) return "green"; if(pct>=60) return "amber"; return "red"; }

/* 28-day heatmap for one item. Mirrors render.py's calCells(): Mon-aligned grid,
   last 4 full weeks ending with the current week's Sunday. */
function _gCalCells(cid, it){
  const now = new Date(); const today = _gToday();
  const todayD = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const end = new Date(now); end.setHours(0,0,0,0);
  end.setDate(end.getDate() + (7 - ((end.getDay()+6)%7)) - 1);
  const startC = new Date(end); startC.setDate(end.getDate() - 27);
  const sched = it.days && it.days.length;
  let html = '<div class="gcal">';
  ["M","T","W","T","F","S","S"].forEach(h => { html += `<span class="gchd">${h}</span>`; });
  for(let d = new Date(startC); d <= end; d.setDate(d.getDate()+1)){
    const k = _gIso(d);
    const done = _gIsDone(cid, it.id, k);
    const skip = _gIsSkip(cid, it.id, k);
    const onSched = sched && it.days.indexOf(d.getDay()) >= 0;
    let cls;
    if(d > todayD) cls = onSched ? "gc-fut gc-futsched" : "gc-fut";
    else if(done) cls = "gc-done";
    else if(skip) cls = "gc-skip";
    else if(sched && onSched && d < todayD) cls = "gc-miss";
    else if(sched && onSched) cls = "gc-rest gc-futsched";
    else cls = "gc-rest";
    const lab = k === today ? "·" : (skip ? "s" : (d.getDate() === 1 ? "1" : ""));
    html += `<span class="gcell ${cls}" data-d="${k}" data-c="${esc(cid)}" data-i="${esc(it.id)}">${lab}</span>`;
  }
  html += '</div>';
  html += sched
    ? '<div class="gleg">🟩 done · 🟥 missed · 🟦 skipped · tap: done → skip → clear</div>'
    : '<div class="gleg">🟩 done · 🟦 skipped · tap: done → skip → clear</div>';
  return html;
}

async function renderGoalsPage(){
  const page = document.getElementById("goalspage");
  if(!page) return;
  page.innerHTML = `<div class="gempty">loading goals…</div>`;

  /* Pull current goal defs + last 35d of habit marks (so the 28-day heatmap has history). */
  const now = new Date();
  const start28 = new Date(now); start28.setDate(now.getDate() - 34);
  const [defs, rows] = await Promise.all([
    _dqKvGet("goals2"),
    _dqHabitRange(_gIso(start28), _gIso(now))
  ]);
  GOALS_STATE.defs = defs || { cats: [] };
  GOALS_STATE.days = {};
  (rows || []).forEach(r => {
    if(!r.done) return;
    if(r.habit && (r.habit.indexOf("G.")===0 || r.habit.indexOf("S.")===0)){
      GOALS_STATE.days[r.day] = GOALS_STATE.days[r.day] || {};
      GOALS_STATE.days[r.day][r.habit] = 1;
    }
  });
  _gDraw();
}

function _gDraw(){
  const page = document.getElementById("goalspage");
  if(!page) return;
  const defs = GOALS_STATE.defs;
  const cats = (defs && Array.isArray(defs.cats)) ? defs.cats : [];
  if(!cats.length){
    page.innerHTML = `<div class="gempty">no goals set yet — add one below</div>
      <div class="gtools gaddcat"><span class="gtool" id="gaddcat">＋ category</span></div>`;
    const addBtn = document.getElementById("gaddcat");
    if(addBtn) addBtn.onclick = _gAddCat;
    return;
  }

  const today = _gToday();
  let totPct = 0, totItems = 0, hitItems = 0;
  cats.forEach(cat => {
    totPct += _gCatPct(cat);
    (cat.items||[]).forEach(it => {
      if(it.opt) return;
      totItems++;
      if(_gWeekHits(cat.id, it) >= (it.min||1)) hitItems++;
    });
  });
  const avgPct = cats.length ? Math.round(totPct / cats.length) : 0;
  const hitPct = totItems ? Math.round(hitItems * 100 / totItems) : 0;
  const avgCls = _gVerdictCls(avgPct);
  const sumCls = _gVerdictCls(hitPct);

  const html = cats.map(cat => {
    const cp = _gCatPct(cat);
    const cpCls = _gVerdictCls(cp);
    const items = cat.items || [];
    const allToday = items.length > 0 && items.every(it => _gIsDone(cat.id, it.id, today));
    const someToday = items.some(it => _gIsDone(cat.id, it.id, today));
    const circCls = allToday ? "gon" : (someToday ? "ghalf" : "");
    const open = GOALS_STATE.openCat === cat.id;

    const llChips = [];
    if(cat.lag) llChips.push(`<span class="ghlag">🎯 ${esc(cat.lag)}</span>`);
    if(cat.lead) llChips.push(`<span class="ghlead">⚡ ${esc(cat.lead)}</span>`);

    const head = `<div class="gcathead" data-c="${esc(cat.id)}">
      <span class="gcirc ${circCls}" data-c="${esc(cat.id)}" data-act="toggleall"></span>
      <div class="gcatmain">
        <div class="gcatnamewrap"><span class="gic">${esc(cat.icon||"🎯")}</span><span class="gnm">${esc(cat.name||cat.id||"")}</span>${cat.star?`<span class="gstar">${esc(cat.star)}</span>`:""}</div>
        ${llChips.length?`<div class="ghll">${llChips.join("")}</div>`:""}
      </div>
      <span class="gcatpct ${cpCls}">${cp}%</span>
      <span class="gchev">▾</span>
    </div>`;

    let body = "";
    if(open){
      const noteOpen = GOALS_STATE.openNote === cat.id;
      body = `<div class="gcatbody">
        <div class="gll">
          <div class="gllrow" data-c="${esc(cat.id)}" data-ll="lag"><span class="gllk glllag">🎯 LAG</span><span>${esc(cat.lag || "tap to set")} ✎</span></div>
          <div class="gllrow" data-c="${esc(cat.id)}" data-ll="lead"><span class="gllk glllead">⚡ LEAD</span><span>${esc(cat.lead || "tap to set")} ✎</span></div>
        </div>`;
      if(cat.note){
        body += `<span class="gnotebtn" data-c="${esc(cat.id)}">${noteOpen?"▴ hide breakdown":"📖 full breakdown"}</span>`;
        if(noteOpen) body += `<div class="gnote">${esc(cat.note)}</div>`;
      }

      items.forEach(it => {
        const hits = _gWeekHits(cat.id, it);
        const pct = _gItemPct(cat.id, it);
        const onToday = _gIsDone(cat.id, it.id, today);
        const per = it.per === "mo" ? "mo" : "wk";
        /* Lead = frequency commitment (daily domino), Lag = outcome/optional target.
           Per Devon's 2026-10-23 rule: lead > lag visually. We treat required items with
           a min/wk as LEAD (green accent), optional items as LAG (amber accent). */
        const isLead = !it.opt && (it.min || 0) > 0;
        const cls = (it.opt ? "opt" : (isLead ? "lead" : "lag"));
        const tgt = it.tgt && it.min && it.tgt !== it.min
          ? `${it.min}-${it.tgt}/${per}`
          : it.min ? `${it.min}/${per}` : "";
        const pctCls = _gVerdictCls(pct);
        const stat = `${hits}/${it.min||1}`;
        const calOpen = GOALS_STATE.openItemCal[cat.id + "." + it.id];
        body += `<div class="gitem ${cls}" data-c="${esc(cat.id)}" data-i="${esc(it.id)}">
          <div class="gitemrow">
            <span class="gichk ${onToday?"gon":""}" data-c="${esc(cat.id)}" data-i="${esc(it.id)}" data-act="toggleitem"></span>
            <span class="giname" data-c="${esc(cat.id)}" data-i="${esc(it.id)}" data-act="togglecal">${esc(it.name||it.id)}</span>
            ${tgt?`<span class="gitgt ${isLead?"lead":"lag"}">${esc(tgt)}</span>`:""}
            <span class="gipct ${pctCls}">${stat}</span>
          </div>
          ${calOpen ? _gCalCells(cat.id, it) : ""}
        </div>`;
      });

      body += `<div class="gtools">
        <span class="gtool" data-c="${esc(cat.id)}" data-act="additem">＋ goal</span>
        <span class="gtool" data-c="${esc(cat.id)}" data-act="editcat">✎ category</span>
      </div></div>`;
    }

    return `<div class="gcat ${open?"open":""}" data-c="${esc(cat.id)}">${head}${body}</div>`;
  }).join("");

  page.innerHTML = `
    <div class="gheader">
      <h2>Goals</h2>
      <small>${cats.length} categories · ${totItems} required goals</small>
      <div class="gstats">
        <span><b>${hitItems}/${totItems}</b> hit · <span class="gpct ${sumCls}">${hitPct}%</span></span>
        <span>avg <span class="gpct ${avgCls}">${avgPct}%</span></span>
      </div>
    </div>
    ${html}
    <div class="gtools gaddcat"><span class="gtool" id="gaddcat">＋ category</span></div>`;

  _gWireEvents();
}

function _gWireEvents(){
  const page = document.getElementById("goalspage");
  if(!page) return;

  /* Cat head → expand/collapse. Big circle inside head is handled separately below. */
  page.querySelectorAll(".gcathead").forEach(el => {
    el.onclick = (ev) => {
      if(ev.target.closest("[data-act=toggleall]")) return;
      const cid = el.getAttribute("data-c");
      GOALS_STATE.openCat = GOALS_STATE.openCat === cid ? null : cid;
      _gDraw();
    };
  });

  /* Big cat circle → mark all items in cat done/undone for today. Mirrors render.py line 877.
     Optimistic: flip local state + redraw IMMEDIATELY, then fire network. On failure, revert + toast. */
  page.querySelectorAll("[data-act=toggleall]").forEach(el => {
    el.onclick = async (ev) => {
      ev.stopPropagation();
      const cid = el.getAttribute("data-c");
      const cat = GOALS_STATE.defs.cats.find(c => c.id === cid); if(!cat) return;
      const today = _gToday();
      const allOn = cat.items.length > 0 && cat.items.every(it => _gIsDone(cid, it.id, today));
      const want = allOn ? 0 : 1;
      GOALS_STATE.days[today] = GOALS_STATE.days[today] || {};
      const prev = {};
      cat.items.forEach(it => {
        prev[it.id] = GOALS_STATE.days[today][_gk(cid, it.id)] || 0;
        GOALS_STATE.days[today][_gk(cid, it.id)] = want;
      });
      _gDraw();
      _rerenderDayUpdateHabits();
      const results = await Promise.all(cat.items.map(it => _dqHabitSet(today, _gk(cid, it.id), want)));
      if(results.some(ok => !ok)){
        cat.items.forEach(it => { GOALS_STATE.days[today][_gk(cid, it.id)] = prev[it.id]; });
        _gDraw(); _rerenderDayUpdateHabits();
        toast("save failed — reverted");
      }
    };
  });

  /* Item circle → cycle today's state (empty → done → skip → clear). Shared helper handles
     optimistic UI + rollback. Cat-tab item circles are 2-state (empty⇄done) for simpler UX;
     full 3-state cycling is only on heatmap cells + modal rows. */
  page.querySelectorAll("[data-act=toggleitem]").forEach(el => {
    el.onclick = async (ev) => {
      ev.stopPropagation();
      const cid = el.getAttribute("data-c"), iid = el.getAttribute("data-i");
      await _gCycleHabit(cid, iid, _gToday(), /*cycleFull=*/false);
    };
  });

  /* Item name → expand/collapse 28-day heatmap. */
  page.querySelectorAll("[data-act=togglecal]").forEach(el => {
    el.onclick = (ev) => {
      ev.stopPropagation();
      const cid = el.getAttribute("data-c"), iid = el.getAttribute("data-i");
      const k = cid + "." + iid;
      GOALS_STATE.openItemCal[k] = !GOALS_STATE.openItemCal[k];
      _gDraw();
    };
  });

  /* Heatmap cell → 3-state cycle (empty → done → skip → clear). Mirrors render.py line 948.
     Devon 2026-10-23: previous code awaited the fetch BEFORE redraw, so taps felt dead on
     mobile. Fixed via _gCycleHabit which updates state + redraws SYNCHRONOUSLY, then posts. */
  page.querySelectorAll(".gcell").forEach(el => {
    el.onclick = async (ev) => {
      ev.stopPropagation();
      if(el.classList.contains("gc-fut")) return;
      const cid = el.getAttribute("data-c"), iid = el.getAttribute("data-i"), dd = el.getAttribute("data-d");
      await _gCycleHabit(cid, iid, dd, /*cycleFull=*/true);
    };
  });

  /* Note button → expand/collapse full breakdown. */
  page.querySelectorAll(".gnotebtn").forEach(el => {
    el.onclick = (ev) => {
      ev.stopPropagation();
      const cid = el.getAttribute("data-c");
      GOALS_STATE.openNote = GOALS_STATE.openNote === cid ? null : cid;
      _gDraw();
    };
  });

  /* Lead/lag inline edit via prompt. */
  page.querySelectorAll(".gllrow").forEach(el => {
    el.onclick = async (ev) => {
      ev.stopPropagation();
      const cid = el.getAttribute("data-c"), k = el.getAttribute("data-ll");
      const cat = GOALS_STATE.defs.cats.find(c => c.id === cid); if(!cat) return;
      const v = prompt(k === "lag" ? "🎯 Lag — the outcome" : "⚡ Lead — the daily domino", cat[k] || "");
      if(v === null) return;
      cat[k] = v.trim();
      await _dqKvSet("goals2", GOALS_STATE.defs);
      _gDraw();
    };
  });

  /* Tool buttons: additem / editcat. */
  page.querySelectorAll(".gtool[data-act]").forEach(el => {
    el.onclick = async (ev) => {
      ev.stopPropagation();
      const act = el.getAttribute("data-act"), cid = el.getAttribute("data-c");
      const cat = GOALS_STATE.defs.cats.find(c => c.id === cid); if(!cat) return;
      if(act === "additem"){
        const nm = prompt("New goal in " + cat.name); if(!nm || !nm.trim()) return;
        const fr = prompt("How often? e.g. 3/wk or 1/mo", "3/wk") || "3/wk";
        const fm = fr.match(/(\d+)\s*\/?\s*(mo|m|wk|w)?/i);
        const per = (fm && fm[2] && fm[2].toLowerCase().charAt(0) === "m") ? "mo" : "wk";
        const cap = per === "mo" ? 31 : 7;
        const mn = Math.min(cap, Math.max(1, fm ? Number(fm[1]) : 3));
        cat.items = cat.items || [];
        cat.items.push({ id:"x"+Date.now().toString(36), name:nm.trim(), min:mn, tgt:mn, per:per, days:[] });
        await _dqKvSet("goals2", GOALS_STATE.defs);
        _gDraw();
      } else if(act === "editcat"){
        const nm = prompt("Category name (empty = delete)", cat.name);
        if(nm === null) return;
        if(!nm.trim()){
          if(!confirm("Delete category " + cat.name + " and all its goals?")) return;
          GOALS_STATE.defs.cats = GOALS_STATE.defs.cats.filter(c => c.id !== cat.id);
        } else {
          cat.name = nm.trim();
          const ic = prompt("Emoji", cat.icon); if(ic) cat.icon = ic.trim();
          const sr = prompt("North-star line", cat.star || "");
          if(sr !== null) cat.star = sr.trim();
          const lg = prompt("🎯 Lag — the outcome", cat.lag || "");
          if(lg !== null) cat.lag = lg.trim();
          const ld = prompt("⚡ Lead — the daily domino", cat.lead || "");
          if(ld !== null) cat.lead = ld.trim();
        }
        await _dqKvSet("goals2", GOALS_STATE.defs);
        _gDraw();
      }
    };
  });

  /* Bottom-of-page add-category button. */
  const addBtn = document.getElementById("gaddcat");
  if(addBtn) addBtn.onclick = _gAddCat;
}

async function _gAddCat(){
  if(!GOALS_STATE.defs) return;
  const nm = prompt("New category name"); if(!nm || !nm.trim()) return;
  const ic = prompt("Emoji", "⭐") || "⭐";
  GOALS_STATE.defs.cats = GOALS_STATE.defs.cats || [];
  GOALS_STATE.defs.cats.push({ id:"c"+Date.now().toString(36), icon:ic.trim(), name:nm.trim(), star:"", items:[] });
  await _dqKvSet("goals2", GOALS_STATE.defs);
  _gDraw();
}
/* Refresh goals whenever user switches to the tab (keeps data fresh without 24/7 polling) */
function _duPinSave(ev){
  const v = ev.target.value.trim();
  localStorage.setItem("ahq_dayfocus", v);
  _dfSync(v);
  const inp = document.getElementById("dfinput"); if(inp) _dfApply(v);
}
/* Auto-pop on load if we're inside the window + haven't dismissed today */
function _duAutoPop(){
  const mode = _duMode();
  if(mode && !_duSeen(mode)) openDayUpdate(mode);
}
/* Trigger once after key is present + first tick has populated state */
setTimeout(_duAutoPop, 2800);

/* ── Push / instant notifications ──
   Two layers: (1) long-poll already keeps the chat live when the tab is open.
   (2) Web Notifications API fires a desktop/mobile banner when a reply lands
   while the tab is backgrounded — Telegram-equivalent ping without a VAPID
   push server. Service worker extends this: notifications persist + wake. */
let _notifPerm = (typeof Notification !== "undefined") ? Notification.permission : "unsupported";
function requestNotifPerm(){
  if(_notifPerm === "unsupported") return;
  if(_notifPerm === "granted") return;
  Notification.requestPermission().then(p => {
    _notifPerm = p;
    if(p === "granted") toast("notifications on");
  });
}
async function showLocalNotification(sender, body){
  if(_notifPerm !== "granted") return;
  const title = `${sender} on Agent Alley`;
  try {
    if("serviceWorker" in navigator && navigator.serviceWorker.ready){
      const reg = await navigator.serviceWorker.ready;
      await reg.showNotification(title, {
        body, icon:"avatars/penny.jpg?v=3", badge:"avatars/penny.jpg?v=3",
        tag:"aa-chat", renotify:true, requireInteraction:false,
      });
      return;
    }
  } catch(e){ /* fall through */ }
  try { new Notification(title, {body, icon:"avatars/penny.jpg?v=3"}); } catch(e){}
}
/* Ask for permission on first user gesture (any click) to satisfy browser gesture requirement. */
document.addEventListener("click", ()=>{ requestNotifPerm(); }, {once:true, capture:true});
/* Kick off the longpoll loop once the key is in and tick has primed state.
   We keep polling even when tab is hidden so push notifications fire for
   backgrounded replies — true Telegram parity. Val.town cost = negligible
   (one 25s connection reused forever = ~3500 reqs/day). */
setTimeout(()=>{ if(KEY) startLongPoll(); }, 1500);
/* PWA service worker — auto-cleans up any stale SW/cache from previous versions so Devon never has to clear browser cache manually again. One-time self-heal. */
if("serviceWorker" in navigator){
  window.addEventListener("load", async ()=>{
    try {
      // Nuke any OLD service workers from previous aggressive cache versions
      const regs = await navigator.serviceWorker.getRegistrations();
      for(const r of regs){
        // Keep only the latest SW URL; unregister anything else
        if(!r.active || !r.active.scriptURL.endsWith("/sw.js")){
          await r.unregister();
        }
      }
      // Also nuke old caches that aren't the current version
      if("caches" in window){
        const names = await caches.keys();
        for(const n of names){
          if(!n.startsWith("aa-v3-")) await caches.delete(n);
        }
      }
      // Register the fresh SW
      const reg = await navigator.serviceWorker.register("./sw.js", {updateViaCache: "none"});
      // Force immediate update check on every page load
      reg.update();
    } catch(e){ console.warn("sw setup failed", e); }
  });
}
</script>
