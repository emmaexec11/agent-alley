<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Agent Alley</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0A0A0F; --s1:#101018; --s2:#15151f; --s3:#1b1b28;
  --line:rgba(255,255,255,.07); --line2:rgba(255,255,255,.12);
  --txt:#ECECF4; --dim:#8E8EA3; --faint:#5B5B70;
  --v:#7C5CFF; --vglow:rgba(124,92,255,.35);
  --green:#4ade80; --amber:#fbbf24; --red:#f87171;
  --claude:#e8a860; --grok:#6fc3ff;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--txt);font:14px/1.5 Inter,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
.mono{font-family:"JetBrains Mono",monospace}

/* aurora */
#aurora{position:fixed;top:-220px;left:50%;transform:translateX(-50%);width:1100px;height:520px;pointer-events:none;z-index:0;filter:blur(110px);opacity:.5}
#aurora::before,#aurora::after{content:"";position:absolute;width:60%;height:70%;border-radius:50%}
#aurora::before{left:8%;top:10%;background:radial-gradient(circle,#7C5CFF 0%,transparent 70%);animation:drift 16s ease-in-out infinite alternate}
#aurora::after{right:4%;top:25%;background:radial-gradient(circle,#3b2a8c 0%,transparent 70%);animation:drift 21s ease-in-out infinite alternate-reverse}
@keyframes drift{to{transform:translate(70px,40px) scale(1.15)}}

header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;padding:16px 26px;background:rgba(10,10,15,.72);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}
header .logo{font-size:17px;font-weight:800;letter-spacing:-.3px}
header .logo em{font-style:normal;background:linear-gradient(100deg,#a78bfa,#7C5CFF);-webkit-background-clip:text;background-clip:text;color:transparent}
header .gen{color:var(--faint);font-size:12px}
header .right{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--dim)}
.livedot{width:8px;height:8px;border-radius:50%;background:var(--red)}
.livedot.ok{background:var(--green);box-shadow:0 0 10px rgba(74,222,128,.7)}

main{position:relative;z-index:1;max-width:1280px;margin:0 auto;padding:26px;display:grid;gap:18px;
  grid-template-columns:1fr 1fr 340px;
  grid-template-areas:"inbox inbox chat" "wings wings chat" "projects projects chat"}
@media(max-width:1000px){main{grid-template-columns:1fr;grid-template-areas:"inbox" "chat" "wings" "projects";padding:14px}}

.tile{background:var(--s1);border:1px solid var(--line);border-radius:18px;transition:border-color .18s,transform .18s}
.tile:hover{border-color:var(--line2)}
h2.sec{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1.6px;color:var(--faint);margin-bottom:12px}

/* ── inbox hero ── */
#inbox{grid-area:inbox;position:relative;overflow:hidden;background:rgba(21,21,31,.6);backdrop-filter:blur(20px);border:1px solid rgba(124,92,255,.28);padding:24px 26px;box-shadow:0 0 44px rgba(124,92,255,.12)}
#inbox .head{display:flex;align-items:baseline;gap:18px;margin-bottom:16px}
#inbox .big{font-size:84px;font-weight:800;line-height:.9;letter-spacing:-4px;font-variant-numeric:tabular-nums;background:linear-gradient(170deg,#fff 30%,#a78bfa);-webkit-background-clip:text;background-clip:text;color:transparent}
#inbox .big.zero{background:none;-webkit-text-fill-color:var(--faint)}
#inbox .cap{font-size:15px;font-weight:600}
#inbox .cap small{display:block;color:var(--dim);font-weight:400;font-size:12.5px;margin-top:3px}
.ibcard{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--s2);border:1px solid var(--line);border-radius:13px;padding:13px 15px;margin-top:9px;transition:transform .15s,border-color .15s}
.ibcard:hover{transform:translateY(-2px);border-color:rgba(124,92,255,.4)}
.ibcard .tag{font-size:10px;font-weight:700;letter-spacing:.8px;padding:4px 9px;border-radius:7px;white-space:nowrap}
.tag.launch{background:rgba(124,92,255,.16);color:#b8a3ff;box-shadow:0 0 14px var(--vglow)}
.tag.stuck{background:rgba(248,113,113,.14);color:var(--red)}
.ibcard .body{flex:1;min-width:180px}
.ibcard .t{font-weight:600;font-size:14px}
.ibcard .sub{color:var(--dim);font-size:12px;margin-top:2px}
.ibcard .btns{display:flex;gap:8px}
button{cursor:pointer;border:none;border-radius:9px;padding:8px 14px;font-size:12.5px;font-weight:700;font-family:inherit;transition:transform .15s,box-shadow .15s}
button:hover{transform:translateY(-1px)}
.b-approve{background:linear-gradient(120deg,#8b6cff,#6c4ce0);color:#fff;box-shadow:0 0 16px var(--vglow)}
.b-back{background:transparent;border:1px solid rgba(248,113,113,.5);color:var(--red)}
.b-chat{background:var(--s3);color:var(--txt);border:1px solid var(--line2)}
.allclear{color:var(--dim);font-size:13.5px;padding:6px 2px}

/* ── cluster map ── */
#clusterwrap{grid-area:wings;padding:12px 16px 8px;overflow:hidden}
#crumb{display:flex;gap:4px;align-items:center;font-size:12px;color:var(--dim);min-height:26px}
#crumb .c{cursor:pointer;padding:3px 9px;border-radius:7px;font-weight:600}
#crumb .c:hover{background:var(--s3);color:var(--txt)}
#crumb .c.cur{color:var(--txt);cursor:default}
#crumb .sep{color:var(--faint)}
#cluster{position:relative;height:430px}
@media(max-width:1000px){#cluster{height:380px}}
#clines{position:absolute;inset:0;width:100%;height:100%}
#clines line{stroke:rgba(124,92,255,.18);stroke-width:1.5}
.cnode{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;animation:pop .35s cubic-bezier(.2,.9,.3,1.25) both}
@keyframes pop{from{opacity:0;transform:translate(-50%,-50%) scale(.55)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
@keyframes pulse{50%{opacity:.45}}
.cnode .orb{display:flex;align-items:center;justify-content:center;border-radius:50%;background:var(--s2);border:1px solid var(--line2);position:relative;transition:border-color .15s,box-shadow .15s,transform .15s}
.orb svg{width:46%;height:46%;filter:drop-shadow(0 0 7px rgba(124,92,255,.55))}
.cnode:hover .orb svg{filter:drop-shadow(0 0 11px rgba(167,139,250,.85))}
.ch svg{width:15px;height:15px;vertical-align:-3px;margin-right:5px;filter:drop-shadow(0 0 5px rgba(124,92,255,.5))}
.allclear svg{width:14px;height:14px;vertical-align:-2px;margin-right:6px}
.cnode:hover .orb{border-color:var(--v);box-shadow:0 0 22px var(--vglow);transform:scale(1.07)}
.cnode .nm{font-size:12px;font-weight:600;text-align:center;max-width:120px;line-height:1.25}
.cnode .sub{font-size:10.5px;color:var(--faint);text-align:center;max-width:130px;margin-top:-2px}
.cnode.hub .orb{width:108px;height:108px;font-size:36px;background:radial-gradient(circle at 35% 30%,rgba(124,92,255,.38),var(--s2) 72%);border-color:rgba(124,92,255,.5);box-shadow:0 0 36px var(--vglow)}
.cnode.hub{cursor:default}
.cnode.wingn .orb{width:92px;height:92px;font-size:32px}
.cnode.deptn .orb{width:74px;height:74px;font-size:26px}
.cnode.agentn .orb{width:62px;height:62px;font-size:23px}
.badge{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:9px;font-size:10.5px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 5px;z-index:2}
.badge.red{background:var(--red);color:#1a0505;box-shadow:0 0 10px rgba(248,113,113,.7)}
.badge.green{background:rgba(74,222,128,.92);color:#05260f}
.ring{position:absolute;inset:-4px;border-radius:50%;border:2px solid transparent;pointer-events:none}
.ring.working{border-color:var(--green);animation:pulse 2s infinite}
.ring.waiting{border-color:var(--amber)}
.ring.stuck{border-color:var(--red);animation:pulse 1.2s infinite}
.hint{font-size:11px;color:var(--faint);text-align:center;padding:2px 0 4px}
@media(max-width:600px){
  .cnode.hub .orb{width:82px;height:82px;font-size:28px}
  .cnode.wingn .orb{width:68px;height:68px;font-size:24px}
  .cnode.deptn .orb{width:58px;height:58px;font-size:21px}
  .cnode.agentn .orb{width:50px;height:50px;font-size:19px}
  .cnode .nm{font-size:11px;max-width:90px}
  .cnode .sub{display:none}
}

/* ── projects ── */
#projects{grid-area:projects}
.projgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(285px,1fr));gap:12px}
.proj{padding:16px 17px}
.proj .top{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.proj .pt{font-weight:700;font-size:14px;flex:1}
.pill{font-size:10px;font-weight:700;letter-spacing:.6px;padding:3px 9px;border-radius:99px;text-transform:uppercase}
.pill.active{background:rgba(74,222,128,.12);color:var(--green)}
.pill.ready{background:rgba(124,92,255,.16);color:#b8a3ff}
.pill.launched{background:rgba(255,255,255,.08);color:var(--dim)}
.pill.parked{background:rgba(251,191,36,.1);color:var(--amber)}
.proj .pd{color:var(--dim);font-size:12.5px;margin-bottom:11px}
.strip{display:flex;align-items:center;gap:5px}
.strip .seg{height:5px;flex:1;border-radius:3px;background:var(--s3)}
.strip .seg.done{background:linear-gradient(90deg,#7C5CFF,#a78bfa)}
.strip .lbl{font-size:10.5px;color:var(--faint);margin-left:6px;white-space:nowrap}
.proj .latest{font-size:11.5px;color:var(--faint);margin-top:9px}

/* ── chat ── */
#chat{grid-area:chat;display:flex;flex-direction:column;min-height:420px;max-height:calc(100vh - 120px);position:sticky;top:86px}
@media(max-width:1000px){#chat{position:static;max-height:460px}}
#chat .ch{padding:15px 17px 8px;font-size:12.5px;font-weight:700}
#chat .ch small{color:var(--faint);font-weight:400;margin-left:6px}
#chatback{float:right;cursor:pointer;color:var(--v);font-size:11px;font-weight:600;padding:2px 8px;border:1px solid rgba(124,92,255,.35);border-radius:7px}
#chatback:hover{background:rgba(124,92,255,.14)}
#msgs{flex:1;overflow-y:auto;padding:4px 14px 10px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:88%;border-radius:13px;padding:8px 12px;font-size:13px;background:var(--s2);border:1px solid var(--line);align-self:flex-start}
.msg.me{align-self:flex-end;background:rgba(124,92,255,.14);border-color:rgba(124,92,255,.3)}
.msg .who{font-size:10.5px;font-weight:700;color:var(--dim);margin-bottom:2px}
.msg .who .when{float:right;color:var(--faint);font-weight:400;margin-left:10px}
#chatform{display:flex;gap:8px;padding:12px 14px;border-top:1px solid var(--line)}
#chatin{flex:1;background:var(--s2);border:1px solid var(--line2);border-radius:10px;padding:9px 12px;color:var(--txt);font:13px Inter;outline:none}
#chatin:focus{border-color:var(--v);box-shadow:0 0 0 3px rgba(124,92,255,.15)}
#chatform button{background:linear-gradient(120deg,#8b6cff,#6c4ce0);color:#fff}

#keygate{position:fixed;inset:0;background:var(--bg);display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;z-index:50}
#keygate input{background:var(--s2);border:1px solid var(--line2);border-radius:10px;padding:11px 15px;color:var(--txt);width:290px;font:14px Inter}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--s3);border:1px solid rgba(124,92,255,.4);padding:10px 18px;border-radius:11px;font-size:13px;display:none;z-index:40;box-shadow:0 0 24px var(--vglow)}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<linearGradient id="ig" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c4b5fd"/><stop offset="1" stop-color="#7C5CFF"/></linearGradient>
</defs></svg>
<div id="aurora"></div>
<div id="keygate"><div style="font-size:19px;font-weight:800">Agent <em style="font-style:normal;color:var(--v)">Alley</em></div><input id="keyin" type="password" placeholder="access key"><button class="b-approve" onclick="saveKey()">Enter</button></div>
<header>
  <div class="logo">Agent <em>Alley</em></div>
  <span class="gen mono" id="gen"></span>
  <div class="right"><span id="statdot" class="livedot"></span><span id="stattxt">connecting…</span></div>
</header>
<main>
  <section class="tile" id="inbox"></section>
  <section class="tile" id="clusterwrap">
    <div id="crumb"></div>
    <div id="cluster"><svg id="clines"></svg><div id="cnodes"></div></div>
    <div class="hint" id="chint">click a cluster to open it · click an agent to talk to them</div>
  </section>
  <section id="projects"><h2 class="sec">Projects</h2><div class="projgrid" id="projgrid"></div></section>
  <aside class="tile" id="chat">
    <div class="ch" id="chathead">Front Office<small>Emma answers here</small></div>
    <div id="msgs"></div>
    <form id="chatform" onsubmit="return sendMsg(event)">
      <input id="chatin" placeholder="Message Emma…" autocomplete="off"><button>Send</button>
    </form>
  </aside>
</main>
<div class="toast" id="toast"></div>
<script>
const EP = "https://emmalindsay--b46b3528cd8a11f1b2291607ee4eb77e.web.val.run";
const STAGES = ["queued","working","checking","lead_review","ready","approved"];
const STAGE_LBL = {queued:"Queued",working:"Working",checking:"Checker QC",lead_review:"Lead review",ready:"Ready",approved:"Approved",sent_back:"Sent back"};
const WING_LBL = {business:"Business", personal:"Personal"};
/* custom icon set — gradient stroke, matches aurora theme */
const ic = p => `<svg viewBox="0 0 24 24" fill="none" stroke="url(#ig)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const ICONS = {
  hub: ic('<path d="M12 2.5l8 4.6v9.8l-8 4.6-8-4.6V7.1z"/><circle cx="12" cy="12" r="1.9"/><path d="M12 10.1V2.5M13.6 13l6.4 3.9M10.4 13L4 16.9"/>'),
  business: ic('<path d="M6 21V4.5A1.5 1.5 0 017.5 3h9A1.5 1.5 0 0118 4.5V21M3 21h18"/><path d="M9.5 7.2h1.6M13 7.2h1.6M9.5 11h1.6M13 11h1.6M9.5 14.8h1.6M13 14.8h1.6"/>'),
  personal: ic('<path d="M20.6 13.2A8.2 8.2 0 1110.8 3.4a6.6 6.6 0 009.8 9.8z"/><path d="M18.5 3v3.6M16.7 4.8h3.6"/>'),
  front_office: ic('<path d="M6.3 16.5a5.7 5.7 0 0111.4 0"/><path d="M12 10.8V9.2"/><circle cx="12" cy="8" r="1.1"/><path d="M4.5 16.5h15M4 19.5h16"/>'),
  marketing: ic('<path d="M3 10.8v2.4a1 1 0 001 1h2.2L11.5 18V6L6.2 9.8H4a1 1 0 00-1 1z"/><path d="M15.5 9.2a4.2 4.2 0 010 5.6M18.3 6.4a8.2 8.2 0 010 11.2"/>'),
  customer_care: ic('<rect x="3" y="5.5" width="18" height="13" rx="1.8"/><path d="M3.5 7l8.5 5.8L20.5 7"/>'),
  creative_studio: ic('<path d="M4 20l9.8-9.8"/><path d="M17 3l1 2.7L20.7 7l-2.7 1L17 10.7 16 8 13.3 7 16 6z"/><path d="M20.3 12.3v2.4M19.1 13.5h2.4"/>'),
  sales: ic('<path d="M3.5 4v16.5h17"/><path d="M6.5 15.5l4-4 3 3 6-6"/><path d="M15.8 8.5h3.7v3.7"/>'),
  finance: ic('<ellipse cx="12" cy="6" rx="7" ry="2.8"/><path d="M5 6v5c0 1.5 3.1 2.8 7 2.8s7-1.3 7-2.8V6"/><path d="M5 11v5.2c0 1.5 3.1 2.8 7 2.8s7-1.3 7-2.8V11"/>'),
  health: ic('<path d="M3.5 12.5h4l2-5.5 4.5 10.5 2.5-5h4"/>'),
  life_ops: ic('<rect x="4" y="5" width="16" height="15.5" rx="2"/><path d="M4 10h16M8.5 3v4M15.5 3v4"/><path d="M8 14h2.5M13 14h3M8 17.3h3.5"/>'),
  agent: ic('<rect x="5" y="8" width="14" height="11.5" rx="2.4"/><path d="M12 8V5.2"/><circle cx="12" cy="3.9" r="1.1"/><path d="M9.3 12.6v1.8M14.7 12.6v1.8M9.5 17.2h5"/>'),
  folder: ic('<path d="M3.5 7A1.5 1.5 0 015 5.5h4l2 2.4h8A1.5 1.5 0 0120.5 9.4v8.1A1.5 1.5 0 0119 19H5a1.5 1.5 0 01-1.5-1.5z"/>'),
  star: ic('<path d="M12 3l2.2 6.8L21 12l-6.8 2.2L12 21l-2.2-6.8L3 12l6.8-2.2z"/>'),
  chat: ic('<path d="M20 13.5a1.6 1.6 0 01-1.6 1.6H9.6L5.4 18.7v-3.6A1.6 1.6 0 014 13.5V5.6A1.6 1.6 0 015.6 4h12.8A1.6 1.6 0 0120 5.6z"/>')
};
const DEPT_LBL = {front_office:"Front Office",marketing:"Marketing",customer_care:"Customer Care",creative_studio:"Creative Studio",sales:"Sales",finance:"Finance",health:"Health",life_ops:"Life Ops"};
const dl = d => DEPT_LBL[d] || d.replace(/_/g," ");

let KEY = localStorage.getItem("ahq_key") || "";
if (location.hash.startsWith("#k=")) { KEY = location.hash.slice(3); localStorage.setItem("ahq_key", KEY); history.replaceState(null,"",location.pathname); }
if (!KEY) document.getElementById("keygate").style.display = "flex";
function saveKey(){ const v=document.getElementById("keyin").value.trim(); if(!v)return; KEY=v; localStorage.setItem("ahq_key",v); document.getElementById("keygate").style.display="none"; tick(); }

async function relay(action, params={}, body=null){
  const qs = new URLSearchParams({k:KEY, action, ...params});
  const r = await fetch(`${EP}/?${qs}`, body ? {method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)} : {});
  if(!r.ok) throw new Error(r.status);
  return r.json();
}
function toast(t){ const el=document.getElementById("toast"); el.textContent=t; el.style.display="block"; setTimeout(()=>el.style.display="none",2600); }
function esc(s){ return String(s??"").replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function ago(ts){ if(!ts) return ""; const d=(Date.now()-new Date(ts+(/Z|\+/.test(ts)?"":"-07:00")).getTime())/60000;
  if(d<1)return"now"; if(d<60)return Math.round(d)+"m"; if(d<1440)return Math.round(d/60)+"h"; return Math.round(d/1440)+"d"; }

function renderInbox(jobs, stuckAgents){
  const ready = jobs.filter(j=>j.stage==="ready");
  const n = ready.length + stuckAgents.length;
  const cards = [
    ...ready.map(j=>`<div class="ibcard"><span class="tag launch">READY TO LAUNCH</span>
      <div class="body"><div class="t">${esc(j.title)}</div><div class="sub">${esc(dl(j.dept))} · ${ago(j.updated)}${j.detail?` — ${esc(j.detail)}`:""}</div></div>
      <div class="btns"><button class="b-approve" onclick="decide(${j.id},'approve')">✓ Approve</button><button class="b-back" onclick="decide(${j.id},'send_back')">Send back</button></div></div>`),
    ...stuckAgents.map(a=>`<div class="ibcard"><span class="tag stuck">STUCK — NEED YOU</span>
      <div class="body"><div class="t">${esc(a.title)}</div><div class="sub">${esc(a.status_detail)||"Couldn't resolve after escalation"}</div></div>
      <div class="btns"><button class="b-chat" onclick="askChat('${esc(a.id)}')">Reply in chat</button></div></div>`)
  ].join("");
  document.getElementById("inbox").innerHTML = `
    <div class="head"><div class="big ${n?"":"zero"}">${n}</div>
      <div class="cap">need${n===1?"s":""} you<small>Everything else is handled — agents working, Emma checking.</small></div></div>
    ${cards || `<div class="allclear">${ICONS.star}All clear. Nothing needs your attention right now.</div>`}`;
}
/* ── cluster map ── */
let ORG = {}, view = {level:"home"};
const wingIco = w => ICONS[w] || ICONS.star;
const deptIco = d => ICONS[d] || ICONS.folder;
const shortName = t => String(t).split("—")[0].replace(/\p{Extended_Pictographic}|️/gu,"").trim();
function deptStats(agents){ return {stuck:agents.filter(a=>a.status==="stuck").length, working:agents.filter(a=>a.status==="working").length}; }
function wingStats(depts){ const s={stuck:0,working:0}; for(const ag of Object.values(depts)){const d=deptStats(ag); s.stuck+=d.stuck; s.working+=d.working;} return s; }
function nav(v){ view=v; renderCluster(); }
function mkNode(spec, x, y){
  const el=document.createElement("div");
  el.className="cnode "+spec.cls;
  el.style.left=x+"px"; el.style.top=y+"px";
  if(spec.delay) el.style.animationDelay=spec.delay+"ms";
  const orb=document.createElement("div"); orb.className="orb"; orb.innerHTML=spec.ico;
  if(spec.ring){ const r=document.createElement("div"); r.className="ring "+spec.ring; orb.appendChild(r); }
  if(spec.red){ const b=document.createElement("div"); b.className="badge red"; b.textContent=spec.red; orb.appendChild(b); }
  else if(spec.green){ const b=document.createElement("div"); b.className="badge green"; b.textContent=spec.green; orb.appendChild(b); }
  el.appendChild(orb);
  const nm=document.createElement("div"); nm.className="nm"; nm.textContent=spec.nm; el.appendChild(nm);
  if(spec.sub){ const s=document.createElement("div"); s.className="sub"; s.textContent=spec.sub; el.appendChild(s); }
  if(spec.click) el.onclick=spec.click;
  return el;
}
function renderCluster(){
  const cont=document.getElementById("cluster"), C=document.getElementById("cnodes"), S=document.getElementById("clines");
  const W=cont.clientWidth, H=cont.clientHeight, cx=W/2, cy=H/2;
  C.innerHTML=""; S.innerHTML="";
  let center, children=[], crumb=[["Alley",()=>nav({level:"home"})]];
  if(view.level==="wing" && !ORG[view.wing]) view={level:"home"};
  if(view.level==="dept" && !(ORG[view.wing]&&ORG[view.wing][view.dept])) view={level:"home"};
  if(view.level==="home"){
    center={ico:ICONS.hub,nm:"Agent Alley",cls:"hub"};
    children=Object.entries(ORG).map(([w,depts])=>{ const st=wingStats(depts);
      return {ico:wingIco(w), nm:WING_LBL[w]||w, sub:Object.keys(depts).length+" departments", cls:"wingn",
        red:st.stuck||0, green:st.stuck?0:(st.working||0), click:()=>nav({level:"wing",wing:w})}; });
  } else if(view.level==="wing"){
    const depts=ORG[view.wing];
    crumb.push([WING_LBL[view.wing]||view.wing,()=>nav({level:"wing",wing:view.wing})]);
    center={ico:wingIco(view.wing), nm:WING_LBL[view.wing]||view.wing, cls:"hub"};
    children=Object.entries(depts).map(([d,agents])=>{ const st=deptStats(agents);
      return {ico:deptIco(d), nm:dl(d), sub:agents.length+(agents.length===1?" agent":" agents"), cls:"deptn",
        red:st.stuck||0, green:st.stuck?0:(st.working||0), click:()=>nav({level:"dept",wing:view.wing,dept:d})}; });
  } else {
    const agents=ORG[view.wing][view.dept];
    crumb.push([WING_LBL[view.wing]||view.wing,()=>nav({level:"wing",wing:view.wing})]);
    crumb.push([dl(view.dept),null]);
    center={ico:deptIco(view.dept), nm:dl(view.dept), cls:"hub"};
    children=agents.map(a=>({ico:ICONS.agent, nm:shortName(a.title), sub:a.status==="idle"?"":a.status_detail||a.status, cls:"agentn",
      ring:a.status!=="idle"?a.status:null, click:()=>openAgentChat(a)}));
  }
  document.getElementById("crumb").innerHTML = crumb.map(([t,fn],i)=>
    `${i?'<span class="sep">›</span>':""}<span class="c ${fn?"":"cur"}" data-i="${i}">${esc(t)}</span>`).join("");
  document.querySelectorAll("#crumb .c").forEach((el,idx)=>{ const fn=crumb[idx][1]; if(fn) el.onclick=fn; });
  C.appendChild(mkNode(center,cx,cy));
  const R=Math.min(W,H)/2-(W<600?48:62);
  children.forEach((ch,i)=>{
    const start = children.length===2 ? 180 : -90;
    const ang=(start+i*360/children.length)*Math.PI/180;
    const x=cx+R*Math.cos(ang), y=cy+(R-14)*Math.sin(ang);
    ch.delay=i*45;
    S.innerHTML+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}"/>`;
    C.appendChild(mkNode(ch,x,y));
  });
}
function renderProjects(projects, jobs){
  document.getElementById("projgrid").innerHTML = projects.map(p=>{
    const pj = jobs.filter(j=>j.project_id===p.id);
    const furthest = Math.max(0, ...pj.map(j=>STAGES.indexOf(j.stage==="sent_back"?"working":j.stage)));
    const latest = pj[0];
    return `<div class="tile proj"><div class="top"><div class="pt">${esc(p.title)}</div><span class="pill ${esc(p.status)}">${esc(p.status)}</span></div>
      <div class="pd">${esc(dl(p.dept))}${p.detail?` — ${esc(p.detail)}`:""}</div>
      <div class="strip">${STAGES.slice(0,5).map((s,i)=>`<span class="seg ${pj.length&&i<=furthest?"done":""}"></span>`).join("")}<span class="lbl">${pj.length?esc(STAGE_LBL[latest.stage]||latest.stage):"no jobs yet"}</span></div>
      ${latest?`<div class="latest">↳ ${esc(latest.title)} · ${ago(latest.updated)}</div>`:""}</div>`;
  }).join("") || `<div style="color:var(--faint)">No projects yet.</div>`;
}
async function decide(id, what){
  const note = what==="send_back" ? (prompt("What needs fixing?")||"") : "";
  if(what==="send_back" && !note) return;
  try{ await relay("queue",{},{kind:"decision",payload:{job_id:id,decision:what,note}});
    toast(what==="approve"?"✓ Approved — Emma is actioning it":"↩ Sent back with your note"); setTimeout(tick,1600);
  }catch(e){ toast("Failed — check connection"); }
}
/* ── chat (Emma by default; click an agent for a direct line) ── */
let chatTarget = null;
function openAgentChat(a){
  chatTarget = (a.id==="emma") ? null : {id:a.id, nm:shortName(a.title)};
  updateChatHead(); loadChat();
  const inp=document.getElementById("chatin"); inp.focus(); inp.scrollIntoView({block:"center"});
}
function updateChatHead(){
  const h=document.getElementById("chathead");
  if(chatTarget){
    h.innerHTML = `${ICONS.chat}${esc(chatTarget.nm)}<small>direct line</small><span id="chatback">↩ back to Emma</span>`;
    document.getElementById("chatback").onclick = ()=>{ chatTarget=null; updateChatHead(); loadChat(); };
  } else {
    h.innerHTML = `${ICONS.chat}Front Office<small>Emma answers here</small>`;
  }
  document.getElementById("chatin").placeholder = chatTarget ? `Message ${chatTarget.nm}…` : "Message Emma…";
}
function askChat(agentId){
  let found=null;
  for(const depts of Object.values(ORG)) for(const agents of Object.values(depts))
    for(const a of agents) if(a.id===agentId) found=a;
  if(found) openAgentChat(found);
  else { const inp=document.getElementById("chatin"); inp.value=`About the stuck ${agentId.replace(/_/g," ")}: `; inp.focus(); }
}
async function sendMsg(ev){
  ev.preventDefault();
  const inp=document.getElementById("chatin"); const t=inp.value.trim(); if(!t)return false;
  inp.value="";
  const text = chatTarget ? `@${chatTarget.id} ${t}` : t;
  try{ await relay("send",{},{room:"hq",sender:"Devon",text}); loadChat(); }catch(e){ toast("Send failed"); }
  return false;
}
async function loadChat(){
  const r = await relay("poll",{room:"hq",limit:60});
  const all = r.msgs||[];
  let msgs;
  if(chatTarget){
    const pre = "@"+chatTarget.id+" ";
    msgs = all.filter(m => (m.sender==="Devon" && m.text.startsWith(pre)) || m.sender===chatTarget.id)
      .map(m => m.sender==="Devon" ? {...m, text:m.text.slice(pre.length)} : {...m, sender:chatTarget.nm});
  } else {
    msgs = all.filter(m => (m.sender==="Devon" && !m.text.startsWith("@")) || m.sender==="Emma");
  }
  document.getElementById("msgs").innerHTML = msgs.map(m=>
    `<div class="msg ${m.sender==="Devon"?"me":""}"><div class="who">${esc(m.sender)}<span class="when">${ago(m.ts)}</span></div>${esc(m.text)}</div>`).join("");
  const el=document.getElementById("msgs"); el.scrollTop=el.scrollHeight;
}
function stuckFromWings(wings){
  const out=[];
  for(const depts of Object.values(wings)) for(const agents of Object.values(depts))
    for(const a of agents) if(a.status==="stuck") out.push(a);
  return out;
}
async function tick(){
  if(!KEY) return;
  try{
    const st = await relay("kvget",{key:"state"});
    const s = st.value || st;
    ORG = s.wings||{};
    renderInbox(s.jobs||[], stuckFromWings(ORG));
    renderCluster();
    renderProjects(s.projects||[], s.jobs||[]);
    document.getElementById("gen").textContent = "synced "+ago(s.generated);
    document.getElementById("statdot").className="livedot ok"; document.getElementById("stattxt").textContent="live";
    loadChat();
  }catch(e){
    document.getElementById("statdot").className="livedot"; document.getElementById("stattxt").textContent="offline";
    if(String(e).includes("401")||String(e).includes("403")) document.getElementById("keygate").style.display="flex";
  }
}
let rsz; window.addEventListener("resize", ()=>{ clearTimeout(rsz); rsz=setTimeout(renderCluster, 150); });
updateChatHead(); tick(); setInterval(tick, 20000);
</script>
</body>
