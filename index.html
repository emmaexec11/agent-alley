<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#7C5CFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Alley">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="app-icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="app-icon-512.png">
<title>Agent Alley v23</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0A0A0F; --s1:#101018; --s2:#15151f; --s3:#1b1b28;
  --line:rgba(255,255,255,.07); --line2:rgba(255,255,255,.12);
  --txt:#ECECF4; --dim:#8E8EA3; --faint:#5B5B70;
  --v:#7C5CFF; --vglow:rgba(124,92,255,.35);
  --green:#4ade80; --amber:#fbbf24; --red:#f87171;
  --chatw:350px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--txt);font:14px/1.5 Inter,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
.mono{font-family:"JetBrains Mono",monospace}
/* ── Futuristic scrollbars throughout — violet glow, thin, matches Agent Alley chrome ── */
*::-webkit-scrollbar{width:8px;height:8px}
*::-webkit-scrollbar-track{background:transparent}
*::-webkit-scrollbar-thumb{background:linear-gradient(180deg,rgba(124,92,255,.45),rgba(167,139,250,.3));border-radius:999px;border:1.5px solid transparent;background-clip:padding-box;box-shadow:0 0 6px rgba(124,92,255,.15)}
*::-webkit-scrollbar-thumb:hover{background:linear-gradient(180deg,rgba(124,92,255,.75),rgba(167,139,250,.5));background-clip:padding-box;box-shadow:0 0 10px rgba(124,92,255,.35)}
*::-webkit-scrollbar-corner{background:transparent}
*{scrollbar-width:thin;scrollbar-color:rgba(124,92,255,.45) transparent}

/* aurora */
#aurora{position:fixed;top:-220px;left:50%;transform:translateX(-50%);width:1100px;height:520px;pointer-events:none;z-index:0;filter:blur(110px);opacity:.5}
#aurora::before,#aurora::after{content:"";position:absolute;width:60%;height:70%;border-radius:50%}
#aurora::before{left:8%;top:10%;background:radial-gradient(circle,#7C5CFF 0%,transparent 70%);animation:drift 16s ease-in-out infinite alternate}
#aurora::after{right:4%;top:25%;background:radial-gradient(circle,#0f5c43 0%,transparent 70%);animation:drift 21s ease-in-out infinite alternate-reverse}
@keyframes drift{to{transform:translate(70px,40px) scale(1.15)}}

header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;padding:13px 22px;background:rgba(10,10,15,.72);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}
header .logo{font-size:17px;font-weight:800;letter-spacing:-.3px}
header .logo em{font-style:normal;background:linear-gradient(100deg,#a78bfa,#7C5CFF);-webkit-background-clip:text;background-clip:text;color:transparent}
header .gen{color:var(--faint);font-size:12px}
header .mantra{color:var(--faint);font-size:11px;font-style:italic;letter-spacing:.2px;margin-left:14px;opacity:.72}
@media(max-width:720px){header .mantra{display:none}}

/* ── Reminders drawer (sticky-note style, side peek tab) ── */
#remtab{display:none}
#remdrawer{position:fixed;right:0;top:0;bottom:0;width:340px;max-width:92vw;background:rgba(15,15,23,.98);backdrop-filter:blur(20px);border-left:1px solid rgba(124,92,255,.4);z-index:60;transform:translateX(100%);transition:transform .22s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;box-shadow:-10px 0 40px rgba(0,0,0,.5)}
#remdrawer.on{transform:translateX(0)}
#remhead{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
#remhead h3{font-size:14px;font-weight:800;letter-spacing:1.2px;color:#c4b5fd;flex:1}
#remhead .add{background:rgba(124,92,255,.2);border:1px solid rgba(124,92,255,.5);color:#c4b5fd;border-radius:8px;padding:6px 12px;font-size:12px;font-weight:700;cursor:pointer}
#remhead .add:hover{background:rgba(124,92,255,.3)}
#remhead .closex{color:var(--faint);cursor:pointer;font-size:18px;padding:0 4px;user-select:none}
#remhead .closex:hover{color:var(--red)}
#remlist{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px}
.remcard{border-radius:10px;padding:12px 13px;position:relative;transition:transform .15s;border:1px solid rgba(0,0,0,.2)}
.remcard:hover{transform:translateY(-1px)}
.remcard.c-yellow{background:#fde68a;color:#422006}
.remcard.c-pink{background:#fbcfe8;color:#500724}
.remcard.c-blue{background:#bfdbfe;color:#172554}
.remcard.c-green{background:#bbf7d0;color:#052e16}
.remcard.c-purple{background:#ddd6fe;color:#2e1065}
.remcard.c-orange{background:#fed7aa;color:#431407}
.remcard .rtxt{font-size:13.5px;font-weight:600;line-height:1.4;white-space:pre-wrap;word-wrap:break-word;cursor:text;outline:none;min-height:20px}
.remcard .rtools{display:flex;align-items:center;gap:6px;margin-top:9px}
.remcard .rcolors{display:flex;gap:4px;flex:1}
.remcard .rswatch{width:16px;height:16px;border-radius:50%;cursor:pointer;border:1.5px solid rgba(0,0,0,.1);transition:transform .15s}
.remcard .rswatch:hover{transform:scale(1.2)}
.remcard .rswatch.sel{border:2px solid rgba(0,0,0,.6)}
.remcard .rdel{color:rgba(0,0,0,.4);cursor:pointer;font-size:14px;font-weight:800;padding:0 4px;user-select:none}
.remcard .rdel:hover{color:#b91c1c}
#remscrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:55;display:none}
#remscrim.on{display:block}
header .right{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--dim)}
.livedot{width:8px;height:8px;border-radius:50%;background:var(--red)}
.livedot.ok{background:var(--green);box-shadow:0 0 10px rgba(74,222,128,.7)}

/* ── bell + notifications panel ── */
.bell{position:relative;background:transparent;border:none;color:var(--dim);padding:5px 6px;cursor:pointer;border-radius:9px;display:flex;align-items:center;justify-content:center;transition:color .15s,background .15s;margin-right:6px}
.bell:hover{color:var(--txt);background:rgba(255,255,255,.04)}
.bell svg{width:18px;height:18px}
.bellbadge{position:absolute;top:1px;right:1px;min-width:14px;height:14px;border-radius:7px;background:var(--red);color:#1a0505;font-size:9.5px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 3px;box-shadow:0 0 8px rgba(248,113,113,.6)}
#notifscrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:35;opacity:0;pointer-events:none;transition:opacity .18s}
#notifscrim:not(.off){opacity:1;pointer-events:auto}
#notifpanel{position:fixed;top:0;right:0;bottom:0;width:380px;max-width:92vw;background:var(--s1);border-left:1px solid var(--line2);z-index:36;transform:translateX(100%);transition:transform .22s cubic-bezier(.2,.9,.3,1.02);display:flex;flex-direction:column;box-shadow:-8px 0 32px rgba(0,0,0,.4)}
#notifpanel:not(.off){transform:translateX(0)}
#notifpanel .nhead{display:flex;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);font-weight:800;letter-spacing:.3px}
#notifpanel #nclose{margin-left:auto;cursor:pointer;color:var(--dim);font-size:17px;padding:3px 7px;border-radius:7px}
#notifpanel #nclose:hover{color:var(--red);background:rgba(248,113,113,.1)}
#notifpanel .nbody{flex:1;overflow-y:auto;padding:14px 16px 24px;display:flex;flex-direction:column;gap:14px}
.nsec{font-size:10.5px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;color:var(--dim);padding:2px 2px 6px;border-bottom:1px solid var(--line)}
.ncard{position:relative;background:var(--s2);border:1px solid var(--line);border-radius:10px;padding:10px 32px 10px 13px}
.ncardx{position:absolute;top:7px;right:9px;cursor:pointer;color:var(--faint);font-size:14px;font-weight:800;padding:3px 7px;border-radius:7px;line-height:1}
.ncardx:hover{color:var(--red);background:rgba(248,113,113,.1)}
.nctl{display:flex;justify-content:flex-end;margin:-2px 0 6px}
.nclrall{background:transparent;border:1px solid var(--line2);color:var(--dim);font-size:11px;font-weight:700;letter-spacing:.5px;padding:4px 10px;border-radius:7px;cursor:pointer}
.nclrall:hover{color:var(--txt);border-color:var(--v)}
.ncard .nct{font-weight:700;font-size:13px;margin-bottom:4px}
.ncard .ncd{color:var(--dim);font-size:12px;line-height:1.4}
.ncard .ncm{color:var(--faint);font-size:10.5px;margin-top:5px;font-family:"JetBrains Mono",monospace}
.nempty{color:var(--faint);font-size:12px;text-align:center;padding:14px 4px}
.dlog{display:flex;flex-direction:column;gap:7px}
.drow{display:flex;align-items:flex-start;gap:10px;padding:8px 2px;border-bottom:1px solid var(--line);font-size:12.5px}
.drow:last-child{border-bottom:none}
.drow .dag{font-weight:700;color:#b8a3ff;flex:0 0 auto;min-width:68px}
.drow .dac{flex:1;min-width:0;color:var(--txt)}
.drow .dac em{font-style:normal;color:var(--dim)}
.drow .dt{flex:0 0 auto;color:var(--faint);font-size:10.5px;font-family:"JetBrains Mono",monospace;margin-left:auto}

/* ── agent status strip ── */
#astrip{position:relative;z-index:1;max-width:1380px;margin:0 auto;padding:12px 22px 0;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
#astrip::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;display:flex;align-items:center;gap:8px;background:rgba(16,16,24,.8);border:1px solid var(--line);border-radius:99px;padding:6px 13px;font-size:12px;font-weight:600;white-space:nowrap;cursor:pointer;transition:border-color .15s,transform .15s}
.chip:hover{transform:translateY(-1px);border-color:var(--line2)}
.chip small{color:var(--dim);font-weight:400;max-width:190px;overflow:hidden;text-overflow:ellipsis}
.chip.off{cursor:default;color:var(--dim)}
.cdot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
.cdot.working{background:var(--green);box-shadow:0 0 9px rgba(74,222,128,.8);animation:pulse 1.8s infinite}
.cdot.waiting{background:var(--amber);box-shadow:0 0 8px rgba(251,191,36,.6)}
.cdot.stuck{background:var(--red);box-shadow:0 0 9px rgba(248,113,113,.85);animation:pulse 1.1s infinite}
.cdot.idle{background:var(--faint)}
.chip .ck{color:var(--green);font-weight:800}
.chip.stuckc{border-color:rgba(248,113,113,.45)}
.chip.donec{border-color:rgba(74,222,128,.3)}
.chip.tgl{cursor:pointer;color:var(--dim);padding:6px 10px}
.chip.tgl:hover{color:var(--txt)}
.chip .x{color:var(--faint);font-weight:800;padding:0 2px 0 6px;cursor:pointer;font-size:11px}
.chip .x:hover{color:var(--red)}

/* ── alert bar ── */
#alertbar{position:relative;z-index:1;max-width:1540px;margin:0 auto;padding:10px 22px 0;display:none;gap:9px;flex-wrap:wrap;align-items:center}
#alertbar.on{display:flex}
/* Futuristic chip — glass base + gradient border + inner glow per severity */
.al{position:relative;display:flex;align-items:center;gap:9px;border-radius:999px;padding:7px 15px 7px 13px;font-size:12px;font-weight:700;letter-spacing:.2px;cursor:pointer;white-space:nowrap;transition:transform .18s,box-shadow .18s,border-color .18s;background:linear-gradient(180deg,rgba(22,22,34,.95),rgba(16,16,24,.95));backdrop-filter:blur(14px);border:1px solid var(--line2);color:var(--txt);overflow:hidden}
.al::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:0}
.al:hover{transform:translateY(-1px);border-color:var(--v);box-shadow:0 4px 18px rgba(0,0,0,.4),0 0 14px rgba(124,92,255,.2)}
.al .ic{font-size:14px;line-height:1}
.al .cnt{font-family:"JetBrains Mono",monospace;font-weight:800;font-size:11.5px}
.al .x{color:var(--faint);font-weight:800;padding:0 2px 0 4px;transition:color .15s}
.al .x:hover{color:var(--red)}
/* severity tiers — each gets its own left-stripe + border + glow */
.al.critical{border-color:rgba(248,113,113,.55);color:#fecaca;box-shadow:0 0 18px rgba(248,113,113,.25),inset 0 0 24px rgba(248,113,113,.08);animation:critPulse 1.3s ease-in-out infinite}
.al.critical::before{background:linear-gradient(180deg,#f87171,#dc2626);box-shadow:0 0 10px rgba(248,113,113,.7)}
.al.critical .ic{color:#f87171;filter:drop-shadow(0 0 6px rgba(248,113,113,.6))}
@keyframes critPulse{0%,100%{box-shadow:0 0 18px rgba(248,113,113,.25),inset 0 0 24px rgba(248,113,113,.08)}50%{box-shadow:0 0 28px rgba(248,113,113,.45),inset 0 0 24px rgba(248,113,113,.14)}}
.al.timer,.al.warn{border-color:rgba(251,191,36,.5);color:#fde68a;box-shadow:0 0 14px rgba(251,191,36,.18)}
.al.timer::before,.al.warn::before{background:linear-gradient(180deg,#fbbf24,#f59e0b);box-shadow:0 0 8px rgba(251,191,36,.5)}
.al.timer.soon{border-color:rgba(248,113,113,.7);color:#fecaca;animation:critPulse 1.1s ease-in-out infinite}
.al.timer.soon::before{background:linear-gradient(180deg,#f87171,#dc2626)}
.al.approval{border-color:rgba(124,92,255,.5);color:#c4b5fd;box-shadow:0 0 14px rgba(124,92,255,.2)}
.al.approval::before{background:linear-gradient(180deg,#a78bfa,#7C5CFF);box-shadow:0 0 8px rgba(124,92,255,.6)}
.al.approval .ic{color:#c4b5fd;filter:drop-shadow(0 0 5px rgba(124,92,255,.5))}
.al.did{border-color:rgba(52,211,153,.35);color:#6ee7b7;box-shadow:0 0 10px rgba(52,211,153,.15);opacity:.9}
.al.did::before{background:linear-gradient(180deg,#34d399,#10b981)}
.al.did .ic{color:#6ee7b7}
.al.info{border-color:var(--line2);color:var(--dim);opacity:.85}
.al.info::before{background:var(--faint)}

/* ── Tasks tab (DHQ-style day cards + list pills) ── */
#taskstab{padding:16px;display:flex;flex-direction:column;gap:14px}

/* Pill selector (horizontal scroll on mobile): switches which list is visible */
.tpills{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:0 2px 4px;-webkit-overflow-scrolling:touch}
.tpills::-webkit-scrollbar{display:none}
.tpill{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;background:var(--s2);border:1px solid var(--line);color:var(--dim);border-radius:999px;padding:7px 15px;font:600 12.5px Inter;cursor:pointer;transition:border-color .15s,color .15s,background .15s;white-space:nowrap;font-family:inherit}
.tpill:hover{color:var(--txt);border-color:var(--line2)}
.tpill.on{background:rgba(124,92,255,.14);border-color:rgba(124,92,255,.5);color:var(--txt);box-shadow:0 0 12px rgba(124,92,255,.18)}
.tpill small{font-weight:700;font-size:11px;color:var(--faint);background:rgba(255,255,255,.06);padding:1px 7px;border-radius:999px}
.tpill.on small{color:#c4b5fd;background:rgba(124,92,255,.22)}
.tpill.drophot{background:rgba(74,222,128,.18);border-color:rgba(74,222,128,.6);color:#6ee7b7;transform:scale(1.04)}

/* Task row: circle checkbox + title + due + inline actions */
.tklist{display:flex;flex-direction:column;gap:3px;margin-top:2px}
.tkr{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:9px;transition:background .12s,opacity .18s;cursor:pointer;position:relative;user-select:none}
.tkr:hover{background:rgba(255,255,255,.03)}
.tkr.dragging{opacity:.45}
.tkr .tbox{flex:0 0 20px;width:20px;height:20px;border-radius:50%;border:1.8px solid var(--faint);display:flex;align-items:center;justify-content:center;font-size:11px;transition:background .15s,border-color .15s,color .15s}
.tkr:hover .tbox{border-color:#c4b5fd}
.tkr.done .tbox{background:var(--v);border-color:var(--v);color:#fff}
.tkr .ttl{flex:1;min-width:0;font-size:13.5px;color:var(--txt);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tkr.done .ttl{text-decoration:line-through;color:var(--faint)}
.tkr.starred .ttl{font-weight:600}
.tkr .tdue{flex:0 0 auto;font-size:10.5px;color:var(--faint);font-family:"JetBrains Mono",monospace;padding:2px 7px;border-radius:7px;background:rgba(255,255,255,.04)}
.tkr .tdue.soon{color:#fcd34d;background:rgba(251,191,36,.1)}
.tkr .tka{flex:0 0 22px;display:flex;align-items:center;justify-content:center;color:var(--faint);cursor:pointer;font-size:14px;line-height:1;padding:3px;border-radius:5px;opacity:0;transition:color .15s,opacity .15s,background .15s}
.tkr:hover .tka{opacity:1}
.tkr.starred .tstar{opacity:1;color:#fcd34d}
.tkr .tka:hover{color:var(--txt);background:rgba(255,255,255,.07)}
.tkr .tstar:hover{color:#fcd34d}
.tkr .tdragh{flex:0 0 14px;color:var(--faint);cursor:grab;opacity:.35;font-size:14px;letter-spacing:1px;line-height:1}
.tkr:hover .tdragh{opacity:.75;color:#c4b5fd}
.tkr .tdragh:active{cursor:grabbing}
/* Custom pointer-based drag ghost + dragging state */
body.tk-dragging{cursor:grabbing;user-select:none;-webkit-user-select:none}
body.tk-dragging .tkr{pointer-events:none}
body.tk-dragging .tpill{pointer-events:auto}
.tkghost{background:rgba(124,92,255,.22);color:var(--txt);border:1px solid rgba(124,92,255,.6);border-radius:8px;padding:7px 12px;font:600 12.5px Inter;max-width:280px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:0 8px 24px rgba(0,0,0,.5),0 0 20px rgba(124,92,255,.3)}
.tkmenu{position:absolute;right:36px;top:34px;background:var(--s2);border:1px solid var(--line2);border-radius:10px;padding:4px;z-index:5;box-shadow:0 8px 24px rgba(0,0,0,.5);display:flex;flex-direction:column;min-width:150px}
.tkmenu button{background:transparent;border:none;color:var(--txt);text-align:left;padding:7px 12px;font:500 12.5px Inter;border-radius:6px;cursor:pointer;font-family:inherit}
.tkmenu button:hover{background:rgba(255,255,255,.06)}
.tkmenu button.danger{color:#f87171}
.tkmenu button.danger:hover{background:rgba(248,113,113,.1)}
.tkadd{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:9px;cursor:text;color:var(--faint);font-size:13px;border:1px dashed var(--line);margin-top:4px;transition:border-color .15s,color .15s}
.tkadd:hover{border-color:var(--line2);color:var(--dim)}
.tkadd input{flex:1;background:transparent;border:none;outline:none;color:var(--txt);font:13.5px Inter;padding:2px 0}
.dcard{border:1px solid var(--line2);border-radius:16px;background:var(--s2);padding:14px 16px}
.dcard.today{border-color:rgba(52,211,153,.35);background:color-mix(in srgb,#34d399 4%,var(--s2))}
.dcard.dragons{border-color:rgba(251,191,36,.3);background:color-mix(in srgb,#fbbf24 3%,var(--s2))}
.dhead{display:flex;align-items:center;gap:9px;font-size:12px;font-weight:800;letter-spacing:1.6px;text-transform:uppercase;margin-bottom:9px;cursor:default}
.dcard.today .dhead{color:#6ee7b7}
.dcard.next .dhead{color:#67e8f9;cursor:pointer}
.dcard.dragons .dhead{color:#fcd34d}
.dcard.later .dhead{color:var(--dim);cursor:pointer}
.dhead svg{width:15px;height:15px;flex:0 0 auto}
.dhead small{color:var(--faint);font-weight:600;letter-spacing:0;text-transform:none;font-size:11.5px}
.dhead .dcaret{margin-left:auto;color:var(--faint);font-size:12px}
.evrow{display:flex;align-items:baseline;gap:12px;padding:5px 2px;font-size:13.5px}
.evrow .evt{flex:0 0 58px;text-align:right;font-size:11px;color:#6ee7b7;font-family:"JetBrains Mono",monospace;white-space:nowrap}
.evrow.allday .evt{color:#fcd34d}
.dcard.next .evrow .evt{color:#67e8f9}
.evrow .evn{flex:1;min-width:0}
.dayhead{font-size:11px;font-weight:700;color:var(--dim);margin:8px 0 2px;padding-left:2px}
.dgrow{display:flex;align-items:center;gap:10px;padding:6px 2px;font-size:13.5px;cursor:pointer;border-radius:8px}
.dgrow:hover{background:rgba(255,255,255,.03)}
.dgchk{flex:0 0 19px;width:19px;height:19px;border-radius:50%;border:1.6px solid rgba(251,191,36,.55);display:flex;align-items:center;justify-content:center;font-size:11px;color:#1a1405;transition:background .15s}
.dgrow.ck .dgchk{background:#fbbf24;border-color:#fbbf24}
.dgrow.ck .dgn{text-decoration:line-through;color:var(--faint)}
.dgrow .dgstar{color:#fcd34d;font-size:12px;flex:0 0 auto}
.dgrow .dgn{flex:1;min-width:0}
.dgrow .tdue{margin-left:auto;font-size:10.5px;color:var(--faint);white-space:nowrap}
.tempty{color:var(--faint);font-size:12px;padding:4px 2px}
.tnote{font-size:10.5px;color:var(--faint);margin-top:6px}

/* ── Goals tab — full DHQ parity (Devon 2026-10-23: proper rebuild w/ heatmap + interactivity)
   Pulls `goals2` kv + habitrange from DHQ relay. Writes go through same keys as render.py
   (G.{cid}.{iid} done + S.{cid}.{iid} skip) so toggles here reflect in DHQ morning/night cards. */
#habitstab{padding:16px}
#habitstab #goalscard{margin:0 0 14px}
#goalspage{display:flex;flex-direction:column;gap:12px}

/* Summary header */
#goalspage .gheader{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px;margin-bottom:2px}
#goalspage .gheader h2{font-size:18px;font-weight:800;letter-spacing:-.3px}
#goalspage .gheader small{color:var(--dim);font-weight:500;font-size:12px}
#goalspage .gstats{margin-left:auto;display:flex;gap:14px;color:var(--dim);font-size:12px;font-family:"JetBrains Mono",monospace}
#goalspage .gstats b{color:var(--txt);font-weight:700;margin-right:4px}
#goalspage .gstats .gpct{color:var(--v)}
#goalspage .gstats .gpct.green{color:var(--green)}
#goalspage .gstats .gpct.amber{color:var(--amber)}
#goalspage .gstats .gpct.red{color:var(--red)}

/* Category card */
#goalspage .gcat{background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:12px 14px;transition:border-color .15s}
#goalspage .gcat:hover{border-color:var(--line2)}
#goalspage .gcat.open{border-color:rgba(124,92,255,.35)}
#goalspage .gcathead{display:flex;align-items:center;gap:11px;cursor:pointer;user-select:none}
#goalspage .gcirc{flex:0 0 20px;width:20px;height:20px;border-radius:50%;border:1.8px solid rgba(124,92,255,.5);background:transparent;display:inline-flex;align-items:center;justify-content:center;transition:background .15s,border-color .15s;cursor:pointer}
#goalspage .gcirc:hover{border-color:var(--v)}
#goalspage .gcirc.ghalf{background:rgba(124,92,255,.25);border-color:var(--v)}
#goalspage .gcirc.gon{background:var(--v);border-color:var(--v);box-shadow:0 0 10px var(--vglow)}
#goalspage .gcirc.gon::after{content:"✓";color:#0a0a0f;font-size:12px;font-weight:900}
#goalspage .gcatmain{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
#goalspage .gcatnamewrap{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
#goalspage .gic{font-size:17px;line-height:1}
#goalspage .gnm{font-weight:700;font-size:14.5px;letter-spacing:-.2px}
#goalspage .gstar{color:var(--dim);font-size:11.5px;font-weight:500}
#goalspage .ghll{display:flex;gap:7px;flex-wrap:wrap;font-size:10.5px;color:var(--faint)}
#goalspage .ghlag{color:var(--amber)}
#goalspage .ghlead{color:var(--green)}
#goalspage .gcatpct{flex:0 0 auto;font-size:13px;font-weight:800;font-family:"JetBrains Mono",monospace;color:var(--v)}
#goalspage .gcatpct.green{color:var(--green)}
#goalspage .gcatpct.amber{color:var(--amber)}
#goalspage .gcatpct.red{color:var(--red)}
#goalspage .gchev{color:var(--faint);font-size:12px;transition:transform .15s;flex:0 0 auto}
#goalspage .gcat.open .gchev{transform:rotate(180deg)}

/* Category body (expanded) */
#goalspage .gcatbody{display:none;padding-top:11px;margin-top:10px;border-top:1px solid var(--line);flex-direction:column;gap:9px}
#goalspage .gcat.open .gcatbody{display:flex}
#goalspage .gll{display:flex;flex-direction:column;gap:5px;background:var(--s2);border-radius:9px;padding:8px 10px;font-size:12px}
#goalspage .gllrow{display:flex;align-items:center;gap:8px;color:var(--dim);cursor:pointer}
#goalspage .gllrow:hover{color:var(--txt)}
#goalspage .gllk{font-weight:700;font-size:10px;letter-spacing:.5px;padding:2px 7px;border-radius:5px;flex:0 0 auto}
#goalspage .glllag{background:rgba(251,191,36,.14);color:var(--amber);border:1px solid rgba(251,191,36,.3)}
#goalspage .glllead{background:rgba(74,222,128,.12);color:var(--green);border:1px solid rgba(74,222,128,.3)}
#goalspage .gnotebtn{align-self:flex-start;font-size:11.5px;color:var(--dim);background:transparent;border:1px solid var(--line);border-radius:8px;padding:4px 10px;cursor:pointer}
#goalspage .gnotebtn:hover{color:var(--txt);border-color:var(--line2)}
#goalspage .gnote{background:var(--s2);border:1px solid var(--line);border-radius:9px;padding:10px 12px;font-size:12px;color:var(--dim);white-space:pre-wrap;line-height:1.5;max-height:320px;overflow-y:auto}

/* Items */
#goalspage .gitem{display:flex;flex-direction:column;gap:4px}
#goalspage .gitemrow{display:flex;align-items:center;gap:10px;padding:6px 2px 6px 9px;border-left:2px solid rgba(124,92,255,.4);font-size:13px}
#goalspage .gitem.lag .gitemrow{border-left-color:rgba(251,191,36,.5)}
#goalspage .gitem.opt .gitemrow{border-left-color:var(--faint);opacity:.75}
#goalspage .gichk{flex:0 0 20px;width:20px;height:20px;border-radius:50%;border:1.8px solid rgba(124,92,255,.5);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;transition:background .15s,border-color .15s}
#goalspage .gichk:hover{border-color:var(--v)}
#goalspage .gichk.gon{background:var(--v);border-color:var(--v)}
#goalspage .gichk.gon::after{content:"✓";color:#0a0a0f;font-size:11px;font-weight:900}
#goalspage .giname{flex:1;min-width:0;color:var(--txt);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
#goalspage .gitem.opt .giname{color:var(--dim)}
#goalspage .gitgt{flex:0 0 auto;font-family:"JetBrains Mono",monospace;font-size:10.5px;padding:2px 8px;border-radius:999px;font-weight:700}
#goalspage .gitgt.lead{color:#c4b5fd;background:rgba(124,92,255,.14);border:1px solid rgba(124,92,255,.3)}
#goalspage .gitgt.lag{color:#fcd34d;background:rgba(251,191,36,.12);border:1px solid rgba(251,191,36,.3)}
#goalspage .gipct{flex:0 0 auto;font-family:"JetBrains Mono",monospace;font-size:11px;font-weight:700;min-width:38px;text-align:right}
#goalspage .gipct.green{color:var(--green)}
#goalspage .gipct.amber{color:var(--amber)}
#goalspage .gipct.red{color:var(--red)}

/* Mini 28-day heatmap */
#goalspage .gcal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;padding:6px 0 4px 31px;max-width:300px}
#goalspage .gchd{font-size:9.5px;color:var(--faint);text-align:center;font-weight:700;letter-spacing:.5px}
#goalspage .gcell{height:20px;border-radius:4px;background:rgba(255,255,255,.06);font-size:10px;text-align:center;line-height:20px;color:var(--faint);cursor:pointer;transition:transform .1s}
#goalspage .gcell:hover{transform:scale(1.15)}
#goalspage .gc-fut{opacity:.4;cursor:default}
#goalspage .gc-fut:hover{transform:none}
#goalspage .gc-futsched{background:rgba(124,92,255,.08);border:1px solid rgba(124,92,255,.2)}
#goalspage .gc-done{background:#22c55e;color:#052e0f}
#goalspage .gc-miss{background:#dc2626;color:#2a0505}
#goalspage .gc-skip{background:#3b82f6;color:#061227}
#goalspage .gc-rest{background:rgba(255,255,255,.04)}
#goalspage .gleg{font-size:10px;color:var(--faint);padding:3px 0 2px 31px;line-height:1.5}

/* Tools (add goal / add category / edit) */
#goalspage .gtools{display:flex;flex-wrap:wrap;gap:7px;padding-top:4px}
#goalspage .gtool{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--dim);background:var(--s2);border:1px solid var(--line);border-radius:8px;padding:5px 11px;cursor:pointer;user-select:none;font-weight:600}
#goalspage .gtool:hover{color:var(--txt);border-color:rgba(124,92,255,.4);background:rgba(124,92,255,.08)}
#goalspage .gaddcat{align-self:center;margin-top:4px}

/* Empty / warn */
#goalspage .gempty{color:var(--faint);font-size:13px;text-align:center;padding:30px 10px;border:1px dashed var(--line);border-radius:12px}
#goalspage .gwarn{background:rgba(248,113,113,.08);border:1px solid rgba(248,113,113,.3);border-radius:10px;padding:9px 13px;font-size:12px;color:#fca5a5}

/* ── new project / finish ── */
.npbtn{display:inline-flex;align-items:center;gap:7px;background:rgba(124,92,255,.12);border:1px solid rgba(124,92,255,.45);color:#c4b5fd;border-radius:10px;padding:8px 15px;font-size:12.5px;font-weight:700;margin-bottom:12px}
#npform{display:none;gap:8px;flex-wrap:wrap;align-items:center;background:var(--s2);border:1px solid rgba(124,92,255,.35);border-radius:13px;padding:11px 13px;margin-bottom:14px}
#npform.on{display:flex}
#npform input,#npform select{background:var(--s3);border:1px solid var(--line2);border-radius:9px;padding:8px 11px;color:var(--txt);font:12.5px Inter;outline:none}
#npform input{flex:1;min-width:170px}
#npform input:focus{border-color:var(--v)}
.pfin{margin-top:10px;background:transparent;border:1px solid var(--line2);color:var(--dim);font-size:11px;padding:5px 11px;border-radius:8px}
.pfin:hover{border-color:rgba(74,222,128,.5);color:var(--green)}
.donetgl{font-size:11.5px;font-weight:700;color:var(--faint);cursor:pointer;margin-top:16px;padding:4px 2px}
.donetgl:hover{color:var(--dim)}

main{position:relative;z-index:1;max-width:1540px;margin:0 auto;padding:14px 22px 26px;display:flex;gap:0;align-items:stretch}
#left{flex:1;min-width:0;display:flex;flex-direction:column;gap:12px}

/* ── Routines sidebar (left) ── */
#routines{flex:0 0 220px;background:var(--s1);border:1px solid var(--line);border-radius:18px;padding:14px 12px;margin-right:12px;align-self:flex-start;position:sticky;top:76px;max-height:calc(100dvh - 100px);overflow-y:auto;scrollbar-width:thin}
#routines::-webkit-scrollbar{width:4px}
#routines::-webkit-scrollbar-thumb{background:var(--line2);border-radius:2px}
#routines .rhead{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;color:var(--dim);padding:0 4px 10px;border-bottom:1px solid var(--line);margin-bottom:10px}
#routines .rhead svg{width:14px;height:14px;color:#c4b5fd}
.rtn{display:flex;align-items:flex-start;gap:9px;padding:9px 7px;border-radius:10px;cursor:pointer;transition:background .15s;margin-bottom:2px}
.rtn:hover{background:rgba(255,255,255,.03)}
.rtn.paused{opacity:.45}
.rtn .ric{flex:0 0 20px;font-size:16px;line-height:1.1;margin-top:1px}
.rtn .rbody{flex:1;min-width:0}
.rtn .rnm{font-weight:600;font-size:12.5px;line-height:1.25}
.rtn .rsc{color:var(--dim);font-size:10.5px;margin-top:2px;line-height:1.3}
.rtn .rnxt{color:#6ee7b7;font-size:10px;margin-top:3px;font-family:"JetBrains Mono",monospace}
.rtn.paused .rnxt{color:var(--faint)}
.rtn .rtgl{flex:0 0 auto;color:var(--faint);font-size:14px;padding:2px 4px;cursor:pointer;user-select:none;line-height:1}
.rtn .rtgl:hover{color:#c4b5fd}
.rtn.paused .rtgl{color:var(--amber)}

.tile{background:var(--s1);border:1px solid var(--line);border-radius:18px;transition:border-color .18s}
.tile:hover{border-color:var(--line2)}

/* ── compact inbox ── */
#inbox{background:rgba(21,21,31,.6);backdrop-filter:blur(20px);border:1px solid rgba(124,92,255,.24);padding:11px 16px}
#inbox.hot{border-color:rgba(124,92,255,.45);box-shadow:0 0 30px rgba(124,92,255,.12)}
.ibzero{display:flex;align-items:center;gap:8px;color:var(--dim);font-size:13px}
.ibzero svg{width:14px;height:14px}
.ibhead{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:700;margin-bottom:4px}
.ibcount{font-size:22px;font-weight:800;background:linear-gradient(170deg,#fff 30%,#a78bfa);-webkit-background-clip:text;background-clip:text;color:transparent}
.ibcard{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--s2);border:1px solid var(--line);border-radius:13px;padding:11px 14px;margin-top:8px;transition:transform .15s,border-color .15s}
.ibcard:hover{transform:translateY(-2px);border-color:rgba(124,92,255,.4)}
.ibcard .tag{font-size:10px;font-weight:700;letter-spacing:.8px;padding:4px 9px;border-radius:7px;white-space:nowrap}
.tag.launch{background:rgba(124,92,255,.16);color:#b8a3ff;box-shadow:0 0 14px var(--vglow)}
.tag.stuck{background:rgba(248,113,113,.14);color:var(--red)}
.ibcard .body{flex:1;min-width:180px}
.ibcard .t{font-weight:600;font-size:14px}
.ibcard .sub{color:var(--dim);font-size:12px;margin-top:2px}
.ibcard .btns{display:flex;gap:8px}
button{cursor:pointer;border:none;border-radius:9px;padding:8px 14px;font-size:12.5px;font-weight:700;font-family:inherit;transition:transform .15s,box-shadow .15s}
button:hover{transform:translateY(-1px)}
.b-approve{background:linear-gradient(120deg,#8b6cff,#6c4ce0);color:#fff;box-shadow:0 0 16px var(--vglow)}
.b-back{background:transparent;border:1px solid rgba(248,113,113,.5);color:var(--red)}
.b-chat{background:var(--s3);color:var(--txt);border:1px solid var(--line2)}

/* ── Top 3 Daily (pulls from Google Tasks starred/due today, collapsible) ── */
#top3{background:linear-gradient(135deg,rgba(124,92,255,.08),rgba(74,222,128,.05));border:1px solid rgba(124,92,255,.35);border-radius:16px;padding:12px 16px;display:none}
#top3.on{display:block}
/* TOP 3 is a homepage-only glance — hide on every other tab */
body:not([data-tab="alley"]) #top3,
body.agent-hub #top3{display:none !important}
#top3.collapsed{padding:8px 16px}
#top3.collapsed .t3row{display:none}
#top3 .t3head{display:flex;align-items:center;gap:9px;font-size:11px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;color:#c4b5fd;margin-bottom:8px;cursor:pointer;user-select:none}
#top3.collapsed .t3head{margin-bottom:0}
#top3 .t3head .t3caret{margin-left:auto;color:var(--faint);font-size:12px;font-weight:400}
#top3 .t3head small{color:var(--faint);font-weight:600;letter-spacing:0;text-transform:none;font-size:11px}
#top3 .t3row{display:flex;align-items:center;gap:11px;padding:7px 2px;font-size:14px;cursor:pointer;border-radius:9px;transition:background .15s}
#top3 .t3row:hover{background:rgba(255,255,255,.03)}
#top3 .t3chk{flex:0 0 20px;width:20px;height:20px;border-radius:50%;border:1.8px solid rgba(124,92,255,.55);display:flex;align-items:center;justify-content:center;font-size:11px;color:#0a0a0f;transition:background .15s}
#top3 .t3row.ck .t3chk{background:#7C5CFF;border-color:#7C5CFF}
#top3 .t3row.ck .t3nm{text-decoration:line-through;color:var(--faint)}
#top3 .t3rank{flex:0 0 20px;color:#c4b5fd;font-weight:800;font-size:13px;font-family:"JetBrains Mono",monospace}
#top3 .t3nm{flex:1;min-width:0;font-weight:600}
#top3 .t3due{margin-left:auto;font-size:11px;color:var(--faint);white-space:nowrap}
#top3 .t3star{color:#fcd34d;font-size:12px;flex:0 0 auto}
#top3 .t3empty{color:var(--faint);font-size:12px;padding:4px 2px;text-align:center}

/* ── left tabs ── */
#lefttabs{display:flex;gap:6px}
#lefttabs .lt{background:transparent;border:1px solid var(--line);color:var(--dim);border-radius:10px;padding:7px 16px;font-size:12.5px}
#lefttabs .lt.on{background:rgba(124,92,255,.14);border-color:rgba(124,92,255,.45);color:var(--txt);box-shadow:0 0 14px rgba(124,92,255,.15)}

/* ── cluster map ── */
#alleytab{padding:12px 16px 8px;overflow:hidden}
#crumb{display:flex;gap:4px;align-items:center;font-size:12px;color:var(--dim);min-height:26px}
#crumb .c{cursor:pointer;padding:3px 9px;border-radius:7px;font-weight:600}
#crumb .c:hover{background:var(--s3);color:var(--txt)}
#crumb .c.cur{color:var(--txt);cursor:default}
#crumb .sep{color:var(--faint)}
#cluster{position:relative;height:500px;overflow:visible}
#cluster .cnode.hub.cos{cursor:grab}
#cluster.panning .cnode.hub.cos{cursor:grabbing}
#cnodes,#clines{transition:transform .25s ease-out}
#cluster.panning #cnodes,#cluster.panning #clines{transition:none}
#clines{position:absolute;inset:0;width:100%;height:100%}
.cnode{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;animation:pop .35s cubic-bezier(.2,.9,.3,1.25) both;--nc:#7C5CFF;--ng:rgba(124,92,255,.35)}
@keyframes pop{from{opacity:0;transform:translate(-50%,-50%) scale(.55)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
@keyframes pulse{50%{opacity:.45}}
.cnode .orb{display:flex;align-items:center;justify-content:center;border-radius:50%;background:var(--s2);border:1px solid color-mix(in srgb,var(--nc) 38%,transparent);position:relative;transition:border-color .15s,box-shadow .15s,transform .15s}
.cnode:hover .orb{border-color:var(--nc);box-shadow:0 0 22px var(--ng);transform:scale(1.07)}
.orb svg{width:46%;height:46%;filter:drop-shadow(0 0 7px var(--ng))}
.cnode:hover .orb svg{filter:drop-shadow(0 0 11px var(--ng))}
.cnode .nm{font-size:12px;font-weight:600;text-align:center;max-width:120px;line-height:1.25}
.cnode .sub{font-size:10.5px;color:var(--faint);text-align:center;max-width:130px;margin-top:-2px}
.cnode.hub .orb{width:116px;height:116px;background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--nc) 34%,transparent),var(--s2) 72%);border-color:color-mix(in srgb,var(--nc) 55%,transparent);box-shadow:0 0 36px var(--ng)}
.cnode.hub{cursor:default}
.cnode.hub.cos{cursor:pointer}
.cnode.hub.cos:hover .orb{transform:scale(1.05);box-shadow:0 0 54px var(--ng)}
.cnode.hub.cos .orb{box-shadow:0 0 46px var(--ng),inset 0 0 20px rgba(255,255,255,.05)}
.cnode .orb .oimg{position:absolute;inset:3px;width:calc(100% - 6px);height:calc(100% - 6px);object-fit:cover;border-radius:50%;z-index:1}
.cnode.hub.cos .orb .cosbadge{position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);font-size:9px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:var(--nc);background:var(--bg);padding:2px 8px;border-radius:999px;border:1px solid color-mix(in srgb,var(--nc) 55%,transparent);white-space:nowrap;z-index:3}
.cnode.hub.cos .sub{font-weight:600;font-size:11.5px;margin-top:10px;color:#6ee7b7;letter-spacing:.2px}
.cnode.hub.cos.hot .sub{color:#c4b5fd;text-shadow:0 0 10px rgba(124,92,255,.5)}

/* ── Pin-the-day card (one line, editable in place, local storage) ── */
#dayfocus{display:flex;align-items:center;gap:10px;background:linear-gradient(135deg,rgba(252,211,77,.07),rgba(124,92,255,.05));border:1px solid rgba(252,211,77,.3);border-radius:12px;padding:9px 14px;margin:4px 0 10px}
#dayfocus .dftag{font-size:9.5px;font-weight:800;letter-spacing:1.4px;color:#fcd34d;white-space:nowrap;flex:0 0 auto}
#dayfocus #dfinput{flex:1;min-width:0;background:transparent;border:none;color:var(--txt);font:600 13px Inter;outline:none;padding:3px 0}
#dayfocus #dfinput::placeholder{color:var(--faint);font-weight:500}
#dayfocus #dfclear{flex:0 0 auto;color:var(--faint);cursor:pointer;font-size:14px;padding:0 4px;user-select:none;visibility:hidden}
#dayfocus.has #dfclear{visibility:visible}
#dayfocus #dfclear:hover{color:var(--red)}

/* ── collapsible KPI strip (Today's Numbers) ── */
#kpistrip{border:1px solid var(--line);border-radius:12px;background:var(--s1);margin:0 0 10px;overflow:hidden}
#kpihead{display:flex;align-items:center;gap:7px;padding:9px 14px;font-size:11.5px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:var(--dim);cursor:pointer;user-select:none}
#kpihead:hover{color:var(--txt)}
#kpihead #kpicaret{font-size:11px;color:var(--faint);transition:transform .18s}
#kpihead small{margin-left:auto;color:var(--faint);font-weight:600;letter-spacing:.3px;text-transform:none;font-size:11px}
#kpirow{display:none;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:9px;padding:4px 14px 13px}
#kpistrip.on #kpirow{display:grid}
#kpistrip.on #kpicaret{transform:rotate(90deg)}
.kpc{background:var(--s2);border:1px solid var(--line);border-radius:10px;padding:9px 12px;min-width:0}
.kpc .kplbl{font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--dim)}
.kpc .kpval{font-size:17px;font-weight:800;margin-top:3px;font-family:"JetBrains Mono",monospace;color:var(--txt)}

.kpc.wyld{border-color:rgba(52,211,153,.3)}

/* ── fleet filter pills (Chief of Staff home) ── */
#fleetfilter{display:flex;gap:6px;padding:4px 0 8px;justify-content:center}
#fleetfilter .ff{background:transparent;border:1px solid var(--line);color:var(--dim);border-radius:999px;padding:5px 18px;font-size:12px;font-weight:600;cursor:pointer;transition:border-color .15s,color .15s,background .15s;font-family:inherit}
#fleetfilter .ff:hover{color:var(--txt);border-color:var(--line2)}
#fleetfilter .ff.on{background:rgba(124,92,255,.14);border-color:rgba(124,92,255,.45);color:var(--txt);box-shadow:0 0 10px rgba(124,92,255,.18)}
#fleetfilter .ff.duquick{padding:5px 11px;font-size:14px}
#fleetfilter .ff.duquick.morn{border-color:rgba(251,191,36,.35)}
#fleetfilter .ff.duquick.morn:hover{color:#fcd34d;border-color:rgba(251,191,36,.6)}
#fleetfilter .ff.duquick.night{border-color:rgba(124,92,255,.35)}
#fleetfilter .ff.duquick.night:hover{color:#c4b5fd;border-color:rgba(124,92,255,.6)}
body:not([data-view="home"]) #fleetfilter{display:none}
.cnode.wingn .orb{width:92px;height:92px}
.cnode.deptn .orb{width:74px;height:74px}
.cnode.agentn .orb{width:62px;height:62px}
.cnode.agentn.fleet .orb{width:78px;height:78px}
.cnode.agentn.fleet .nm{font-size:12.5px;font-weight:700}
.badge{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:9px;font-size:10.5px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 5px;z-index:2}
.badge.red{background:var(--red);color:#1a0505;box-shadow:0 0 10px rgba(248,113,113,.7)}
.badge.green{background:rgba(74,222,128,.92);color:#05260f}
.ring{position:absolute;inset:-5px;border-radius:50%;border:2.5px solid transparent;pointer-events:none}
.ring.working{border-color:var(--green);animation:livepulse 1.8s ease-in-out infinite;box-shadow:0 0 18px rgba(74,222,128,.55),0 0 36px rgba(74,222,128,.3)}
.ring.waiting{border-color:var(--amber);animation:livepulse 2.4s ease-in-out infinite;box-shadow:0 0 16px rgba(251,191,36,.5)}
.ring.stuck{border-color:var(--red);animation:livepulse 1s ease-in-out infinite;box-shadow:0 0 20px rgba(248,113,113,.7),0 0 40px rgba(248,113,113,.4)}
/* Orb body also pulses in sympathy with the ring — glow halo breathes with it */
.cnode.agentn .orb{transition:box-shadow .3s}
.cnode.agentn:has(.ring.working) .orb{box-shadow:0 0 28px rgba(74,222,128,.35);animation:livepulse 1.8s ease-in-out infinite}
.cnode.agentn:has(.ring.stuck) .orb{box-shadow:0 0 32px rgba(248,113,113,.55);animation:livepulse 1s ease-in-out infinite}
.cnode.agentn:has(.ring.waiting) .orb{box-shadow:0 0 24px rgba(251,191,36,.4);animation:livepulse 2.4s ease-in-out infinite}
@keyframes livepulse{0%,100%{opacity:.55}50%{opacity:1}}
.hint{font-size:11px;color:var(--faint);text-align:center;padding:2px 0 4px}

body.agent-hub #chint,
body.agent-hub #fleetfilter,
body.agent-hub #lefttabs,
body.agent-hub #dayfocus,
body.agent-hub #kpistrip,
body.agent-hub #top3,
body.agent-hub #inbox,

body.agent-hub #recapcard{display:none !important}

.hbhead{display:flex;align-items:center;gap:12px;padding:6px 2px 14px;border-bottom:1px solid var(--line);margin-bottom:12px}
.hbhead .hbback{background:transparent;border:1px solid var(--line2);color:var(--dim);border-radius:9px;padding:6px 12px;font:600 12px Inter;cursor:pointer;font-family:inherit}
.hbhead .hbback:hover{color:var(--txt);border-color:var(--v)}
.hbhead .hbav{width:36px;height:36px;border-radius:50%;object-fit:cover;border:1px solid var(--line2)}
.hbhead .hbtitle{font-weight:800;font-size:15px;flex:1}
.hbhead .hbtitle small{color:var(--dim);font-weight:500;font-size:12px;margin-left:7px}
.hbhead .hbmake{background:rgba(124,92,255,.14);border:1px solid rgba(124,92,255,.4);color:#c4b5fd;border-radius:9px;padding:6px 11px;font:700 11.5px Inter;cursor:pointer;font-family:inherit;flex:0 0 auto}
.hbhead .hbmake:hover{background:rgba(124,92,255,.22)}
.hbtabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:0 2px 10px}
.hbtabs::-webkit-scrollbar{display:none}
.hbtab{flex:0 0 auto;background:transparent;border:1px solid var(--line);color:var(--dim);border-radius:999px;padding:5px 12px;font:600 11.5px Inter;cursor:pointer;font-family:inherit;white-space:nowrap}
.hbtab.on{background:rgba(124,92,255,.14);border-color:rgba(124,92,255,.45);color:var(--txt)}
.hbgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}
.hbcard{background:var(--s2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0;transition:border-color .15s}
.hbcard:hover{border-color:var(--line2)}
.hbcard .hblbl{font-size:10.5px;font-weight:800;letter-spacing:1.1px;text-transform:uppercase;color:var(--dim)}
.hbcard .hbval{font-size:19px;font-weight:800;margin-top:4px;font-family:"JetBrains Mono",monospace;color:var(--txt)}
.hbcard .hbsub{font-size:11px;color:var(--faint);margin-top:3px}
.hbcard.wyld{border-color:rgba(52,211,153,.3)}.hbcard.wyld .hbval{color:#6ee7b7}
.hbcard.meta{border-color:rgba(96,165,250,.3)}.hbcard.meta .hbval{color:#93c5fd}

.hbnote{font-size:11.5px;color:var(--faint);text-align:center;padding:14px 4px;border:1px dashed var(--line);border-radius:10px;margin-top:12px}

/* ── projects tab (pill-switched row list, mirrors Tasks UX) ── */
#projectstab{padding:16px}
.ppills{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:0 2px 10px;-webkit-overflow-scrolling:touch}
.ppills::-webkit-scrollbar{display:none}
.ppill{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;background:var(--s2);border:1px solid var(--line);color:var(--dim);border-radius:999px;padding:7px 15px;font:600 12.5px Inter;cursor:pointer;transition:border-color .15s,color .15s,background .15s;white-space:nowrap;font-family:inherit}
.ppill:hover{color:var(--txt);border-color:var(--line2)}
.ppill.on{background:rgba(124,92,255,.14);border-color:rgba(124,92,255,.5);color:var(--txt);box-shadow:0 0 12px rgba(124,92,255,.18)}
.ppill small{font-weight:700;font-size:11px;color:var(--faint);background:rgba(255,255,255,.06);padding:1px 7px;border-radius:999px}
.ppill.on small{color:#c4b5fd;background:rgba(124,92,255,.22)}
.ppill.drophot{background:rgba(74,222,128,.18);border-color:rgba(74,222,128,.6);color:#6ee7b7;transform:scale(1.04)}
.plist{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.pr{display:flex;align-items:center;gap:12px;padding:11px 14px;background:var(--s1);border:1px solid var(--line);border-left:3px solid var(--line);border-radius:10px;cursor:pointer;transition:border-color .15s,background .12s,opacity .18s;position:relative;user-select:none}
.pr:hover{border-color:var(--line2);background:var(--s2)}
.pr.dragging{opacity:.45}
.pr.pdone .pt{color:var(--dim)}

.pr .pdragh{flex:0 0 14px;color:var(--faint);cursor:grab;opacity:.4;font-size:14px;letter-spacing:1px;line-height:1}
.pr:hover .pdragh{opacity:.75;color:#c4b5fd}
.pr .pdragh:active{cursor:grabbing}
.pr .prmain{flex:1;min-width:0}
.pr .pt{font-weight:700;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pr .psub{font-size:11.5px;color:var(--dim);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pr .psub .pstage{color:#93c5fd}
.pr .psub .pwhen{color:var(--faint);font-family:"JetBrains Mono",monospace;font-size:10.5px}
.pr .practs{flex:0 0 auto;display:flex;gap:6px}
.pr .practs button{padding:6px 11px;font-size:11.5px}
.prempty{color:var(--faint);font-size:12.5px;text-align:center;padding:24px 4px;border:1px dashed var(--line);border-radius:10px}
.pradd{display:flex;align-items:center;gap:10px;padding:10px 14px;border:1px dashed var(--line);border-radius:10px;cursor:text;transition:border-color .15s}
.pradd:hover{border-color:var(--line2)}
.pradd .padico{color:var(--faint);font-size:18px;font-weight:300;flex:0 0 auto}
.pradd input{flex:1;background:transparent;border:none;outline:none;color:var(--txt);font:13px Inter;padding:2px 0}
.pradd input::placeholder{color:var(--faint)}
.pradd select{background:var(--s2);border:1px solid var(--line2);color:var(--txt);font:11.5px Inter;padding:5px 8px;border-radius:7px;outline:none;flex:0 0 auto;font-family:inherit}
.gsec{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1.6px;margin:14px 0 9px}
.gsec:first-child{margin-top:0}
.gsec.ready{color:#b8a3ff}.gsec.active{color:var(--green)}.gsec.launched{color:var(--dim)}.gsec.parked{color:var(--amber)}
.projgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.proj{padding:15px 16px;border-left:3px solid var(--line2)}
.proj .top{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.proj .pt{font-weight:700;font-size:14px;flex:1}
.pill{font-size:10px;font-weight:700;letter-spacing:.6px;padding:3px 9px;border-radius:99px;text-transform:uppercase}
.pill.queued{background:rgba(255,255,255,.08);color:var(--dim)}
.pill.working{background:rgba(96,165,250,.14);color:#93c5fd}
.pill.active{background:rgba(74,222,128,.12);color:var(--green)}
.pill.checking{background:rgba(103,232,249,.14);color:#67e8f9}
.pill.lead_review{background:rgba(251,191,36,.14);color:#fcd34d}
.pill.ready{background:rgba(124,92,255,.16);color:#b8a3ff}
.pill.approved{background:rgba(217,70,239,.15);color:#e879f9}
.pill.sent_back{background:rgba(248,113,113,.14);color:#fecaca}
.pill.launched{background:rgba(255,255,255,.08);color:var(--dim)}
.pill.parked{background:rgba(251,191,36,.1);color:var(--amber)}
/* Project card tint based on status — Devon wants visual differentiation, not all green */
.proj.st-queued{background:color-mix(in srgb,#ffffff 2%,var(--s1))}
.proj.st-working{background:color-mix(in srgb,#60a5fa 4%,var(--s1));border-top:2px solid rgba(96,165,250,.35)}
.proj.st-active{background:color-mix(in srgb,#4ade80 4%,var(--s1));border-top:2px solid rgba(74,222,128,.35)}
.proj.st-checking{background:color-mix(in srgb,#67e8f9 4%,var(--s1));border-top:2px solid rgba(103,232,249,.4)}
.proj.st-lead_review{background:color-mix(in srgb,#fbbf24 5%,var(--s1));border-top:2px solid rgba(251,191,36,.5)}
.proj.st-ready{background:color-mix(in srgb,#7C5CFF 6%,var(--s1));border-top:2px solid rgba(124,92,255,.55);box-shadow:0 0 14px rgba(124,92,255,.1)}
.proj.st-approved{background:color-mix(in srgb,#d946ef 4%,var(--s1));border-top:2px solid rgba(217,70,239,.4)}
.proj.st-sent_back{background:color-mix(in srgb,#f87171 5%,var(--s1));border-top:2px solid rgba(248,113,113,.5)}
.proj.st-launched{opacity:.7}
.proj.st-parked{background:color-mix(in srgb,#fbbf24 3%,var(--s1));opacity:.85}
.proj .pd{color:var(--dim);font-size:12.5px;margin-bottom:11px}
.strip{display:flex;align-items:center;gap:5px}
.strip .seg{height:5px;flex:1;border-radius:3px;background:var(--s3)}
.strip .seg.done{background:linear-gradient(90deg,#7C5CFF,#a78bfa)}
.strip .lbl{font-size:10.5px;color:var(--faint);margin-left:6px;white-space:nowrap}
.proj .latest{font-size:11.5px;color:var(--faint);margin-top:9px}

/* ── chat + drag handle ── */
/* Full-pane modes: snap one side to zero so the other goes edge-to-edge.
   Drag handle stays visible on the surviving edge so Devon can pull the hidden pane back. */
body[data-pane="full-alley"] #chat{display:none}
body[data-pane="full-chat"] #left,body[data-pane="full-chat"] #routines{display:none}
body[data-pane="full-chat"] #chat{flex:1;width:auto;min-width:0}
#drag{flex:0 0 18px;cursor:col-resize;position:relative;touch-action:none;-webkit-user-select:none;user-select:none}
#drag::before{content:"";position:absolute;left:-6px;right:-6px;top:0;bottom:0}
#drag::after{content:"";position:absolute;left:7px;top:12%;bottom:12%;width:4px;border-radius:2px;background:var(--line);transition:background .15s}
#drag:hover::after,#drag.on::after{background:var(--v);box-shadow:0 0 10px var(--vglow)}
body.dragging{cursor:col-resize;-webkit-user-select:none;user-select:none}
body.dragging #chat,body.dragging main{pointer-events:none}
#chat{flex:0 0 var(--chatw);width:var(--chatw);min-width:0;display:flex;flex-direction:column;position:sticky;top:76px;height:calc(100vh - 100px);min-height:380px}
#chat .ch{padding:15px 17px 8px;font-size:12.5px;font-weight:700;position:relative;display:flex;align-items:center;justify-content:space-between}
#chat .ch small{color:var(--faint);font-weight:400;margin-left:6px}
.ch svg{width:15px;height:15px;vertical-align:-3px;margin-right:5px;filter:drop-shadow(0 0 5px rgba(124,92,255,.5))}
#chatback{position:absolute;top:12px;right:14px;cursor:pointer;color:#c4b5fd;font-size:13px;font-weight:700;padding:6px 12px;border:1px solid rgba(124,92,255,.45);border-radius:8px;background:rgba(124,92,255,.08);transition:all .2s;display:flex;align-items:center;gap:6px}
#chatback:hover{background:rgba(124,92,255,.16);border-color:rgba(124,92,255,.7);color:#fff}
#chatback svg{width:16px;height:16px;stroke-width:2.5}
#msgs{flex:1;overflow-y:auto;padding:4px 14px 10px;display:flex;flex-direction:column;gap:10px;scroll-behavior:smooth}
#scrollbtn{position:absolute;bottom:130px;right:24px;width:40px;height:40px;border-radius:50%;background:rgba(124,92,255,.2);border:1.5px solid rgba(124,92,255,.5);color:#c4b5fd;display:none;align-items:center;justify-content:center;cursor:pointer;font-size:18px;transition:background .2s,border-color .2s,opacity .2s;z-index:10}
#scrollbtn:hover{background:rgba(124,92,255,.35);border-color:rgba(124,92,255,.7)}
#scrollbtn.show{display:flex;opacity:1}
#scrollbtn.hidden{opacity:.3;pointer-events:none}
/* Telegram-style bubbles: comfortable padding, rounded, text selectable for copy/paste. */
.msg{max-width:88%;border-radius:16px;padding:10px 14px;font-size:14px;background:var(--s2);border:1px solid var(--line);align-self:flex-start;overflow-wrap:break-word;line-height:1.42;-webkit-user-select:text;user-select:text;min-width:0;display:flex;flex-direction:column}
.msg.me{align-self:flex-end;background:rgba(124,92,255,.18);border-color:rgba(124,92,255,.35)}
/* Wider chat panel → more generous bubbles (match Telegram feel on wide view) */
@media(min-width:1001px){#chat #msgs .msg{font-size:14.5px;max-width:85%}}
.msg .who{font-size:10.5px;font-weight:700;color:var(--dim);margin-bottom:2px}
.msg .who .when{float:right;color:var(--faint);font-weight:400;margin-left:10px}
/* ── chat list (Telegram-style) ── */
#chatlist{flex:1;overflow-y:auto;display:none}
#chat.conv #chatlist{display:flex !important;flex-direction:column;border-top:1px solid var(--line);padding-top:8px;margin-top:auto;max-height:160px;overflow-y:auto;gap:2px}
#chat.conv #chatlist .clsec{font-size:9px;letter-spacing:1.2px;text-transform:uppercase;padding:6px 2px 4px;margin-top:6px;margin-bottom:2px}
#chat.conv #chatlist .crow{padding:5px 6px;font-size:12px}
.crow{display:flex;align-items:center;gap:11px;padding:10px 15px;cursor:pointer;border-bottom:1px solid var(--line);transition:background .12s}
.crow:hover{background:var(--s2)}
.cav{position:relative;flex:0 0 42px;width:42px;height:42px;border-radius:50%;background:var(--s2);border:1px solid var(--line2);display:flex;align-items:center;justify-content:center}
.cav svg{width:52%;height:52%}
.cav .cimg{position:absolute;inset:0;width:100%;height:100%;border-radius:50%;object-fit:cover}
#goalscard{margin:10px 14px 14px;border:1px solid color-mix(in srgb,#22d3ee 22%,transparent);border-radius:14px;background:color-mix(in srgb,#22d3ee 4%,transparent);padding:10px 12px}
#goalscard:empty{display:none}
.ghead{font-size:12.5px;font-weight:700;display:flex;align-items:center;gap:6px;margin-bottom:7px}
.ghead svg{width:14px;height:14px}
.ghead small{color:var(--faint);font-weight:400;margin-left:2px}
.gpct{margin-left:auto;font-size:13px}
.gpct.ok,.gv.ok{color:#34d399}.gpct.warn,.gv.warn{color:#f59e0b}
.grow{display:flex;align-items:center;gap:8px;padding:5px 2px;cursor:pointer;font-size:12px}
.grow:hover{background:rgba(255,255,255,.03);border-radius:8px}
.gic{width:18px;text-align:center;flex:0 0 18px}
.gnm{flex:0 0 108px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gbar{flex:1;height:5px;border-radius:3px;background:rgba(255,255,255,.07);overflow:hidden}
.gbar i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,#22d3ee,#34d399)}
.gbar i.low{background:linear-gradient(90deg,#f59e0b,#f87171)}
.gv{flex:0 0 30px;text-align:right;font-weight:700;font-size:11.5px}
.gdet{padding:2px 8px 8px 28px;font-size:11.5px;color:var(--faint)}
.gll{margin:2px 0}
.gitem{display:flex;justify-content:space-between;gap:10px;padding:2px 0}
.gitem em{font-style:normal;opacity:.55;font-size:10px}
#recapcard{margin:0 14px 14px;border:1px solid var(--line2);border-radius:14px;background:rgba(124,92,255,.04);padding:10px 12px}
#recapcard:empty{display:none}
#usagecard{margin:0 14px 14px;border:1px solid var(--line2);border-radius:14px;background:rgba(124,92,255,.04);padding:10px 12px}
#usagecard:empty{display:none}
.urow{display:flex;align-items:center;gap:9px;padding:4px 0;font-size:12px}
.urow .unm{width:120px;color:var(--dim)}
.urow .ubar{flex:1;height:6px;border-radius:4px;background:var(--line);overflow:hidden}
.urow .ubar i{display:block;height:100%;border-radius:4px;background:var(--green)}
.urow .ubar i.warn{background:var(--amber)}.urow .ubar i.hot{background:var(--red)}
.urow .uv{width:40px;text-align:right;font-weight:700}
.urow .ur{width:88px;text-align:right;color:var(--faint);font-size:10.5px}
.rchips{display:flex;gap:6px;margin:6px 0 7px;flex-wrap:wrap}
.rchip2{font-size:10.5px;padding:2px 8px;border-radius:999px;border:1px solid var(--line2);color:var(--faint)}
.rchip2 b{color:var(--ink);font-weight:700}
.rline{display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--dim);padding:4px 2px;line-height:1.3;white-space:nowrap;overflow:hidden}
.rline .rico{flex:0 0 14px;text-align:center;font-weight:800;font-size:12px;opacity:.95}
.rline .rtxt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.rline.done{color:#6ee7b7}.rline.done .rico{color:#34d399}
.rline.stuck{color:#fcd34d}.rline.stuck .rico{color:#f59e0b}
.rline.mov{color:var(--txt)}.rline.mov .rico{color:#93c5fd}
.rchip2.done{color:#6ee7b7;border-color:rgba(52,211,153,.3)}
.rchip2.mov{color:#93c5fd;border-color:rgba(96,165,250,.3)}
.rchip2.stuck{color:#fcd34d;border-color:rgba(251,191,36,.3)}

.att{margin-top:8px;display:flex;flex-direction:column;gap:6px;min-height:0}

#qprev{display:none;align-items:center;gap:8px;margin:0 14px 6px;padding:7px 11px;background:var(--s2);border-left:3px solid var(--v);border-radius:10px;font-size:12px;color:var(--dim)}

#chatform{display:flex;gap:10px;padding:14px 14px;border-top:1px solid var(--line);align-items:center}
#attbtn{background:var(--s2);border:1px solid var(--line2);border-radius:12px;width:46px;height:46px;display:flex;align-items:center;justify-content:center;padding:0;flex:0 0 auto}

/* ── Morning / Night update modal — Agent Alley chrome through and through.

   same card/pill/row patterns as the rest of the app. ── */
#dayupdate{position:fixed;inset:0;z-index:60;display:none;background:var(--bg);flex-direction:column;height:100dvh;height:100vh}

#dayupdate .duclose{flex:0 0 auto;background:transparent;border:1px solid var(--line);color:var(--dim);border-radius:999px;width:34px;height:34px;cursor:pointer;font-size:16px;line-height:1;padding:0;font-family:inherit;transition:color .15s,border-color .15s}

#dayupdate .duhero .duorb{flex:0 0 72px;width:72px;height:72px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--v) 34%,transparent),var(--s2) 72%);border:1px solid color-mix(in srgb,var(--v) 55%,transparent);box-shadow:0 0 36px var(--vglow)}

#dayupdate .duhero h1{font-size:28px;font-weight:800;letter-spacing:-.5px;color:var(--txt)}

const EP = "https://emmalindsay--b46b3528cd8a11f1b2291607ee4eb77e.web.val.run";

const STAGE_LBL = {queued:"Queued",working:"Working",checking:"Checker QC",lead_review:"Lead review",ready:"Ready",approved:"Approved",sent_back:"Sent back"};
const WING_LBL = {business:"Business", personal:"Personal"};
const DEPT_LBL = {front_office:"Front Office",marketing:"Marketing",customer_care:"Customer Care",creative_studio:"Creative Studio",sales:"Sales",finance:"Finance",health:"Health",life_ops:"Life Ops"};
const dl = d => DEPT_LBL[d] || d.replace(/_/g," ");

/* ── wing colour system: business green, personal purple, extras cycle ── */
const WING_CLR = {
  business:{c:"#34d399",glow:"rgba(52,211,153,.4)",g:"igG"},
  personal:{c:"#22d3ee",glow:"rgba(34,211,238,.42)",g:"igC"}
};
const EXTRA_CLR = [
  {c:"#fbbf24",glow:"rgba(251,191,36,.4)",g:"igA"},
  {c:"#f472b6",glow:"rgba(244,114,182,.4)",g:"igP"}
];
const VIOLET = {c:"#7C5CFF",glow:"rgba(124,92,255,.35)",g:"igV"};
let _extraIdx = {};
function wingClr(w){
  if(WING_CLR[w]) return WING_CLR[w];
  if(!(w in _extraIdx)) _extraIdx[w] = Object.keys(_extraIdx).length % EXTRA_CLR.length;
  return EXTRA_CLR[_extraIdx[w]];
}

/* ── custom icon set — gradient strokes, aurora theme ── */
const P = {

  marketing:'<path d="M3 10.8v2.4a1 1 0 001 1h2.2L11.5 18V6L6.2 9.8H4a1 1 0 00-1 1z"/><path d="M15.5 9.2a4.2 4.2 0 010 5.6M18.3 6.4a8.2 8.2 0 010 11.2"/>',
  customer_care:'<rect x="3" y="5.5" width="18" height="13" rx="1.8"/><path d="M3.5 7l8.5 5.8L20.5 7"/>',
  creative_studio:'<path d="M4 20l9.8-9.8"/><path d="M17 3l1 2.7L20.7 7l-2.7 1L17 10.7 16 8 13.3 7 16 6z"/><path d="M20.3 12.3v2.4M19.1 13.5h2.4"/>',

  finance:'<ellipse cx="12" cy="6" rx="7" ry="2.8"/><path d="M5 6v5c0 1.5 3.1 2.8 7 2.8s7-1.3 7-2.8V6"/><path d="M5 11v5.2c0 1.5 3.1 2.8 7 2.8s7-1.3 7-2.8V11"/>',
  health:'<path d="M3.5 12.5h4l2-5.5 4.5 10.5 2.5-5h4"/>',

  agent:'<rect x="5" y="8" width="14" height="11.5" rx="2.4"/><path d="M12 8V5.2"/><circle cx="12" cy="3.9" r="1.1"/><path d="M9.3 12.6v1.8M14.7 12.6v1.8M9.5 17.2h5"/>',
  folder:'<path d="M3.5 7A1.5 1.5 0 015 5.5h4l2 2.4h8A1.5 1.5 0 0120.5 9.4v8.1A1.5 1.5 0 0119 19H5a1.5 1.5 0 01-1.5-1.5z"/>',
  star:'<path d="M12 3l2.2 6.8L21 12l-6.8 2.2L12 21l-2.2-6.8L3 12l6.8-2.2z"/>',
  chat:'<path d="M20 13.5a1.6 1.6 0 01-1.6 1.6H9.6L5.4 18.7v-3.6A1.6 1.6 0 014 13.5V5.6A1.6 1.6 0 015.6 4h12.8A1.6 1.6 0 0120 5.6z"/>',
  clip:'<path d="M20 11.5l-8 8a5.2 5.2 0 01-7.4-7.4l8.5-8.5a3.5 3.5 0 015 5l-8.5 8.5a1.8 1.8 0 01-2.6-2.6l7.8-7.8"/>'
};
const icon = (n,g="igV") => `<svg viewBox="0 0 24 24" fill="none" stroke="url(#${g})" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${P[n]||P.star}</svg>`;

let KEY = localStorage.getItem("ahq_key") || "";
if (location.hash.startsWith("#k=")) { KEY = location.hash.slice(3); localStorage.setItem("ahq_key", KEY); history.replaceState(null,"",location.pathname); }
if (!KEY) document.getElementById("keygate").style.display = "flex";
function saveKey(){ const v=document.getElementById("keyin").value.trim(); if(!v)return; KEY=v; localStorage.setItem("ahq_key",v); document.getElementById("keygate").style.display="none"; tick(); }

async function relay(action, params={}, body=null){
  const qs = new URLSearchParams({k:KEY, action, ...params});
  const r = await fetch(`${EP}/?${qs}`, body ? {method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)} : {});
  if(!r.ok) throw new Error(r.status);
  return r.json();
}
function toast(t){ const el=document.getElementById("toast"); el.textContent=t; el.style.display="block"; setTimeout(()=>el.style.display="none",2600); }
function esc(s){ return String(s??"").replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function ago(ts){ if(!ts) return ""; const d=(Date.now()-new Date(ts+(/Z|\+/.test(ts)?"":"-07:00")).getTime())/60000;
  if(d<1)return"now"; if(d<60)return Math.round(d)+"m"; if(d<1440)return Math.round(d/60)+"h"; return Math.round(d/1440)+"d"; }
function hoursSince(ts){ if(!ts) return 1e9; return (Date.now()-new Date(ts+(/Z|\+/.test(ts)?"":"-07:00")).getTime())/3600000; }

/* ── tabs ── */
let curTab = localStorage.getItem("ahq_tab") || "alley";
function setTab(t){
  curTab = t; localStorage.setItem("ahq_tab", t);
  document.body.dataset.tab = t;
  document.querySelectorAll("#lefttabs .lt").forEach(b=>b.classList.toggle("on", b.dataset.t===t || (t==="chat"&&b.dataset.t==="alley")));
  document.querySelectorAll("#bnav .bn").forEach(b=>b.classList.toggle("on", b.dataset.t===t));
  /* Mobile: chat tab opens full-screen chat (no header/nav), back button returns to alley. */
  if(window.innerWidth<=1000){
    const wasOpen = document.body.dataset.chatopen==="1";
    const nowOpen = (t==="chat");
    document.body.dataset.chatopen = nowOpen ? "1" : "0";
    /* Push a history entry when entering so hardware back closes chat instead of exiting PWA. */
    if(nowOpen && !wasOpen){ try{ history.pushState({chat:1}, "", "#chat"); }catch(e){} }
  }
  if(t==="alley") requestAnimationFrame(renderCluster);
  if(t==="chat"){ const el=document.getElementById("msgs"); el.scrollTop=el.scrollHeight; }
  if(t==="habits") renderGoalsPage();
}
function resetAlleyHome(){
  /* Double-click Alley button → scroll to top + reset cluster zoom + go to home view */
  setTab("alley");
  document.body.dataset.view = "home";
  localStorage.setItem("ahq_view", "home");
  const alleytab = document.getElementById("alleytab");
  if(alleytab) alleytab.scrollTop = 0;
  /* Reset cluster panning if it exists */
  const cnodes = document.getElementById("cnodes");
  const clines = document.getElementById("clines");
  if(cnodes && clines){
    cnodes.style.transform = "translate(0, 0)";
    clines.style.transform = "translate(0, 0)";
  }
  requestAnimationFrame(renderCluster);
}
function closeChatFullscreen(){
  document.body.dataset.chatopen = "0";
  setTab("alley");
  try{ history.replaceState({}, "", "#"); }catch(e){}
}
/* Hardware/browser back → exit full-screen chat first, then let browser navigate. */
window.addEventListener("popstate", ()=>{
  if(document.body.dataset.chatopen==="1"){ closeChatFullscreen(); }
});
/* Mobile keyboard detection — hide bottom nav + askbar while keyboard is up so the chat gets the full screen. */
(function kbdWatch(){
  if(!window.visualViewport) return;
  const update = ()=>{
    const vv = window.visualViewport;
    const hidden = (window.innerHeight - vv.height) > 150;
    document.body.dataset.kbd = hidden ? "1" : "0";
  };
  window.visualViewport.addEventListener("resize", update);
  window.visualViewport.addEventListener("scroll", update);
  update();
})();

/* ── top strip: critical-only (today's birthdays / all-day events) ──
   agent statuses live in the cluster + chat views, never up here.
   Dismiss state resets daily so tomorrow's chips show up fresh. */
let chipsOpen = localStorage.getItem("ahq_chips")!=="0";
function toggleChips(){ chipsOpen=!chipsOpen; localStorage.setItem("ahq_chips",chipsOpen?"1":"0"); renderStrip(LASTJOBS); }
function _todayKey(){ const d=new Date(); return `ahq_dismissed_strip_${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`; }
function _getDismissedChips(){ try{ return new Set(JSON.parse(localStorage.getItem(_todayKey())||"[]")); }catch(e){ return new Set(); } }
function _saveDismissedChips(set){ localStorage.setItem(_todayKey(), JSON.stringify([...set])); }
function dismissStripChip(key, ev){ if(ev){ ev.stopPropagation(); ev.preventDefault(); }
  const d=_getDismissedChips(); d.add(key); _saveDismissedChips(d); renderStrip(); }
function renderStrip(){
  let html = "";
  
  /* Agent status chips — recent/active agents */
  if(CREW && CREW.length){
    CREW.forEach(([id,nm,w])=>{
      const ag = findAgent(id);
      const st = ag ? ag.status : "idle";
      const clr = wingClr(w || "business");
      const dotClass = st==="working"?"working":st==="stuck"?"stuck":st==="waiting"?"waiting":"idle";
      html += `<div class="chip" style="border-color:color-mix(in srgb,${clr.c} 45%,transparent)" onclick="askChat('${esc(id)}')">
        <div class="cdot ${dotClass}"></div>${esc(nm)}<small>${st==="idle"?"":""+st}</small></div>`;
    });
  }
  
  /* Event/birthday chips */
  const evs = (TASKS && TASKS.today && TASKS.today.events) ? TASKS.today.events.filter(e=>{
    if(!e.all_day) return false;
    const t = (e.title||"").trim();
    if(!t) return false;
    if(/^\(?\s*untitled\s*\)?$/i.test(t)) return false;
    return true;
  }) : [];
  const dismissed = _getDismissedChips();
  const parts = evs.filter(e=>!dismissed.has(e.title)).map(e=>{
    const bday = /birthday/i.test(e.title);
    const key = e.title.replace(/'/g,"&#39;").replace(/"/g,'&quot;');
    return `<div class="chip" style="border-color:rgba(251,191,36,.35);color:#fde68a;cursor:default">${bday?"🎂":"📅"} ${esc(e.title)}<small>today</small><span class="x" onclick="dismissStripChip('${key}', event)" title="Dismiss">✕</span></div>`;
  });
  
  html += parts.join("");
  if(!html){ document.getElementById("astrip").innerHTML=""; return; }
  const tgl = `<div class="chip off tgl" onclick="toggleChips()" title="${chipsOpen?"Hide":"Show"} today's notes">${
    chipsOpen?"▾":`▸<small>${parts.length} today</small>`}</div>`;
  document.getElementById("astrip").innerHTML = tgl + html;
}

function mkNode(spec, x, y){
  const el=document.createElement("div");
  el.className="cnode "+spec.cls;
  el.style.left=x+"px"; el.style.top=y+"px";
  const clr = spec.clr || VIOLET;
  el.style.setProperty("--nc", clr.c); el.style.setProperty("--ng", clr.glow);
  if(spec.delay) el.style.animationDelay=spec.delay+"ms";
  const orb=document.createElement("div"); orb.className="orb"; orb.innerHTML=spec.ico;
  if(spec.avatar){ const im=document.createElement("img"); im.className="oimg"; im.src="avatars/"+spec.avatar+".jpg?v=3";
    im.onerror=()=>im.remove(); orb.appendChild(im); }
  if(spec.badge){ const b=document.createElement("div"); b.className="cosbadge"; b.textContent=spec.badge; orb.appendChild(b); }
  if(spec.ring){ const r=document.createElement("div"); r.className="ring "+spec.ring; orb.appendChild(r); }
  if(spec.red){ const b=document.createElement("div"); b.className="badge red"; b.textContent=spec.red; orb.appendChild(b); }
  else if(spec.green){ const b=document.createElement("div"); b.className="badge green"; b.textContent=spec.green; orb.appendChild(b); }
  el.appendChild(orb);
  const nm=document.createElement("div"); nm.className="nm"; nm.textContent=spec.nm; el.appendChild(nm);
  if(spec.sub){ const s=document.createElement("div"); s.className="sub"; s.textContent=spec.sub; el.appendChild(s); }
  if(spec.click) el.onclick=spec.click;
  return el;
}
let _clHash="";
function renderCluster(){
  const cont=document.getElementById("cluster"), C=document.getElementById("cnodes"), S=document.getElementById("clines");
  if(!cont.clientWidth) return;
  const W=cont.clientWidth, H=cont.clientHeight, cx=W/2, cy=H/2;

  // every sync poll replays the node entry animation (visible flash)
  const hash=JSON.stringify(view)+"|"+W+"x"+H+"|"+JSON.stringify(ORG);
  if(hash===_clHash) return;
  _clHash=hash;
  C.innerHTML=""; S.innerHTML="";
  let center, children=[], crumb=[["Alley",()=>nav({level:"home"})]];
  if(view.level==="wing" && !ORG[view.wing]) view={level:"home"};
  if(view.level==="dept" && !(ORG[view.wing]&&ORG[view.wing][view.dept])) view={level:"home"};
  if(view.level==="home"){
    document.body.dataset.view = "home";

    const emmaAg = findAgent("emma");
    /* CEO-glance subtitle: one short phrase, no text overwhelm. Reflects the inbox count. */
    const readyN = (LASTJOBS||[]).filter(j=>j.stage==="ready").length;
    const stuckN = stuckFromWings(ORG).length;
    const inboxN = readyN + stuckN;
    const ceoSub = inboxN ? `${inboxN} need you` : "all clear";
    center = {ico:"", avatar:"ali", nm:"Ali", sub:ceoSub, cls:"hub cos"+(inboxN?" hot":""), clr:VIOLET, badge:"Alley Manager",
      ring: emmaAg && emmaAg.status && emmaAg.status!=="idle" ? emmaAg.status : null,
      click: openEmmaChat};
    /* Ali = center, native-in-Alley manager. All original CREW (incl. Emma) orbit — orbs open their TG chats. */
    const fleet = CREW.filter(([id,nm,w]) => (fleetFilter==="all" || w===fleetFilter));
    /* Short labels for mobile — "Naturally Wyld CS" wraps at narrow widths */
    const SHORT = {cs_bot:"Wyld CS",meta_copilot:"Meta",pitch:"Outreach",carol:"Books",sage:"SAGE"};
    const narrow = window.innerWidth<=1000;
    /* Devon's rule 2026-10-23: pulse should be a VALUABLE SIGNAL, not noise.
       Always-on crons (CS inbox watcher, Meta refresh) perpetually mark themselves "working" —
       that becomes meaningless flashing. Only pulse the orb for exceptional states:
         - "stuck" → red pulse (ALWAYS)
         - "working" → green pulse ONLY if NOT a background-cron agent
       Everything else = calm. */
    const BG_CRON_AGENTS = new Set(["cs_bot","meta_copilot","carol","pitch"]);
    const _pulseRing = (ag) => {
      if(!ag || !ag.status || ag.status==="idle") return null;
      if(ag.status==="stuck") return "stuck";
      if(ag.status==="waiting") return "waiting";
      /* working: suppress for always-on cron agents */
      if(ag.status==="working" && BG_CRON_AGENTS.has(ag.id)) return null;
      return ag.status;
    };
    children = fleet.map(([id,nm,w])=>{
      const clr=wingClr(w); const ag=findAgent(id);
      return {ico:icon("agent",clr.g), avatar:id, nm: narrow && SHORT[id] ? SHORT[id] : nm, cls:"agentn fleet", clr,
        ring: _pulseRing(ag), badge: TG_HANDLES[id] ? "TG" : null,
        click:()=>openCrewTG(id, nm)};
    });
    if(!children.length){
      children = [{ico:icon("star"), nm:"No agents in this view", cls:"agentn", clr:VIOLET}];
    }
  } else if(view.level==="wing"){
    document.body.dataset.view = "wing";
    const depts=ORG[view.wing]; const clr=wingClr(view.wing);
    crumb.push([WING_LBL[view.wing]||view.wing,()=>nav({level:"wing",wing:view.wing})]);
    center={ico:icon(P[view.wing]?view.wing:"star", clr.g), nm:WING_LBL[view.wing]||view.wing, cls:"hub", clr};
    children=Object.entries(depts).map(([d,agents])=>{ const st=deptStats(agents);
      return {ico:icon(P[d]?d:"folder", clr.g), nm:dl(d), sub:agents.length+(agents.length===1?" agent":" agents"), cls:"deptn", clr,
        red:st.stuck||0, green:st.stuck?0:(st.working||0), click:()=>nav({level:"dept",wing:view.wing,dept:d})}; });
  } else {
    document.body.dataset.view = "dept";
    const agents=ORG[view.wing][view.dept]; const clr=wingClr(view.wing);
    crumb.push([WING_LBL[view.wing]||view.wing,()=>nav({level:"wing",wing:view.wing})]);
    crumb.push([dl(view.dept),null]);
    center={ico:icon(P[view.dept]?view.dept:"folder", clr.g), nm:dl(view.dept), cls:"hub", clr};
    children=agents.map(a=>({ico:icon("agent", clr.g), nm:shortName(a.title), sub:a.status==="idle"?"":a.status_detail||a.status, cls:"agentn", clr,
      ring:a.status!=="idle"?a.status:null, click:()=>openAgentChat(a)}));
  }
  document.getElementById("crumb").innerHTML = crumb.map(([t,fn],i)=>
    `${i?'<span class="sep">›</span>':""}<span class="c ${fn?"":"cur"}" data-i="${i}">${esc(t)}</span>`).join("");
  document.querySelectorAll("#crumb .c").forEach((el,idx)=>{ const fn=crumb[idx][1]; if(fn) el.onclick=fn; });
  C.appendChild(mkNode(center,cx,cy));
  const R=Math.min(W,H)/2-(W<600?48:62);
  children.forEach((ch,i)=>{
    const start = children.length===2 ? 180 : -90;
    const ang=(start+i*360/children.length)*Math.PI/180;
    const x=cx+R*Math.cos(ang), y=cy+(R-14)*Math.sin(ang);
    ch.delay=i*45;
    const lc=(ch.clr||VIOLET).c;
    S.innerHTML+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" style="stroke:${lc};stroke-opacity:.22;stroke-width:1.5"/>`;
    C.appendChild(mkNode(ch,x,y));
  });
}

const PPILLS = [

function _pStageText(p, jobs){
  const pj = jobs.filter(j=>j.project_id===p.id);
  if(!pj.length) return "waiting to start";
  const latest = pj[0];
  if(p.status==="launched") return "launched";
  if(p.status==="parked") return "parked";
  if(p.status==="ready") return "ready to launch";
  return STAGE_LBL[latest.stage] || latest.stage;
}
function renderProjects(projects, jobs){
  if(!projects) return;
  const wrap = document.getElementById("projwrap");
  /* Done pile auto-ages out: hide launched/parked projects older than 7 days (keeps the Done pill lean). */
  const SEVEN_D = 7 * 24 * 3600 * 1000;
  const _recent = p => {
    if(!["launched","parked"].includes(p.status)) return true;
    const t = p.updated || p.created || null;
    if(!t) return true;
    return (Date.now() - new Date(t).getTime()) < SEVEN_D;
  };
  const activeProjects = projects.filter(_recent);
  /* Pills + counts */
  const counts = Object.fromEntries(PPILLS.map(p=>[p.k, activeProjects.filter(x=>p.statuses.includes(x.status)).length]));
  const pills = `<div class="ppills">`+PPILLS.map(p=>
    `<button class="ppill${activeProjPill===p.k?" on":""}" data-k="${p.k}" data-pstatus="${p.statuses[0]}"
       ondragover="pDragOver(event,'${p.k}')" ondragleave="pDragLeave(event)" ondrop="pDrop(event,'${p.k}')"
       onclick="setProjPill('${p.k}')">${p.ico} ${esc(p.lbl)}<small>${counts[p.k]||0}</small></button>`
  ).join("")+`</div>`;
  /* Rows for active pill */
  const activeDef = PPILLS.find(p=>p.k===activeProjPill) || PPILLS[0];
  const list = activeProjects.filter(p=>activeDef.statuses.includes(p.status));
  const rows = list.length ? list.map(p=>{
    const pj = jobs.filter(j=>j.project_id===p.id);
    const latest = pj[0];
    const wc = wingClr(p.wing||"business").c;
    const stageText = _pStageText(p, jobs);
    const needsMe = activeDef.k==="ready";
    const isDone = ["launched","parked"].includes(p.status);
    return `<div class="pr${isDone?" pdone":""}" style="border-left-color:${wc}" data-pid="${p.id}"
        draggable="true" ondragstart="pDragStart(event,${p.id},'${esc(p.status)}')" ondragend="pDragEnd(event)"
        onclick="openProjectChat(${p.id})">
      ${isDone?`<span class="pdoneck" title="Accomplished">✓</span>`:""}
      <div class="prmain">
        <div class="pt">${esc(p.title)}</div>
        <div class="psub"><span class="pdept">${esc(dl(p.dept))}</span> · <span class="pstage">${esc(stageText)}</span>${latest?` · <span class="pwhen">${esc(ago(latest.updated))}</span>`:""}</div>
      </div>
      <div class="practs" onclick="event.stopPropagation()">
        ${needsMe ? `<button class="b-approve" title="Launch" onclick="finishProject(${p.id},event)">✓ Launch</button>` : ""}
        <span class="pdragh" title="Drag to another pill">⋮⋮</span>
      </div>
    </div>`;
  }).join("") : `<div class="prempty">nothing in ${esc(activeDef.lbl)}</div>`;
  /* Inline add row (at bottom) */
  const dept0 = NP_DEPTS[0];
  const add = `<div class="pradd" onclick="pAddFocus()">
    <span class="padico">+</span>
    <input id="pradin" placeholder="queue a project…" onkeydown="pAddKey(event)">
    <select id="praddept" onclick="event.stopPropagation()">${NP_DEPTS.map(([d,w,l])=>`<option value="${d}|${w}">${l}</option>`).join("")}</select>
  </div>`;
  wrap.innerHTML = pills + `<div class="plist">${rows}</div>` + add;
}

let _pDragId = null, _pDragStatus = null;
function pDragStart(ev, pid, status){
  _pDragId = pid; _pDragStatus = status;

  try{ ev.dataTransfer.setData("text/plain", String(pid)); }catch(e){}

  ev.currentTarget.classList.remove("dragging");

/* split a rendered message into leading "> [Who] …" quote block + body */
function splitQuote(txt){
  const lines = txt.split("\n");
  const q = [];
  while(lines.length && lines[0].startsWith("> ")) q.push(lines.shift().slice(2));
  if(!q.length || !q[0].startsWith("[")) return {q:null, body:txt};
  return {q:q.join("\n"), body:lines.join("\n").trim()};
}

const readAsDataURL = f => new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(f); });
async function downscale(f){
  const url = await readAsDataURL(f);
  const img = await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=url; });
  const M=1400, sc=Math.min(1, M/Math.max(img.width,img.height));
  if(sc===1 && f.size<500*1024) return url;
  const cv=document.createElement("canvas"); cv.width=Math.round(img.width*sc); cv.height=Math.round(img.height*sc);
  cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
  return cv.toDataURL("image/jpeg",.82);
}
