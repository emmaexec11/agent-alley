<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Wyld Agent HQ</title>
<style>
:root{
  --bg:#0d1117; --panel:#161b22; --panel2:#1c2330; --border:#2a3140;
  --txt:#e6e9ef; --dim:#8b96a8; --accent:#A05A3C; --green:#3fb950;
  --blue:#58a6ff; --amber:#d29922; --purple:#bc8cff; --red:#f85149;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--border);background:var(--panel);position:sticky;top:0;z-index:5}
header h1{font-size:17px;font-weight:700;letter-spacing:.3px}
header .sub{color:var(--dim);font-size:12px}
header .right{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:12px;color:var(--dim)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--red);display:inline-block}
.dot.ok{background:var(--green)}
main{display:grid;grid-template-columns:230px 1fr 300px;gap:0;height:calc(100vh - 53px)}
@media(max-width:900px){main{grid-template-columns:1fr;height:auto}}
/* org sidebar */
#org{border-right:1px solid var(--border);overflow-y:auto;padding:14px}
#org h2{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--dim);margin-bottom:10px}
.dept{margin-bottom:14px}
.dept>.dname{font-weight:700;font-size:13px;text-transform:capitalize;margin-bottom:5px;color:var(--accent)}
.role{display:flex;align-items:center;gap:7px;padding:4px 6px;border-radius:6px;font-size:12.5px;color:var(--txt)}
.role:hover{background:var(--panel2)}
.badge{font-size:9.5px;padding:1px 6px;border-radius:9px;font-weight:700;letter-spacing:.4px}
.badge.claude{background:#3a2e22;color:#e8a860}
.badge.grok{background:#22303a;color:#6fc3ff}
/* board */
#board{overflow-x:auto;padding:14px;display:flex;gap:12px;align-items:flex-start}
.col{min-width:215px;flex:1;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:10px}
.col h3{font-size:11px;text-transform:uppercase;letter-spacing:1px;margin-bottom:9px;display:flex;align-items:center;gap:6px}
.col h3 .cnt{margin-left:auto;color:var(--dim);font-weight:400}
.card{background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:9px 10px;margin-bottom:8px}
.card .t{font-weight:600;font-size:13px;margin-bottom:3px}
.card .m{font-size:11px;color:var(--dim);display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.card .d{font-size:12px;color:var(--dim);margin-top:5px;white-space:pre-wrap}
.card .btns{display:flex;gap:6px;margin-top:8px}
button{cursor:pointer;border:none;border-radius:6px;padding:6px 11px;font-size:12px;font-weight:600;color:#fff}
.approve{background:var(--green);color:#06130a}
.sendback{background:transparent;border:1px solid var(--red);color:var(--red)}
.s-queued h3{color:var(--dim)} .s-working h3{color:var(--blue)} .s-checking h3{color:var(--amber)}
.s-lead_review h3{color:var(--purple)} .s-ready h3{color:var(--green)}
.s-approved h3{color:var(--green)} .s-sent_back h3{color:var(--red)}
/* chat */
#chat{border-left:1px solid var(--border);display:flex;flex-direction:column}
#chat h2{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--dim);padding:14px 14px 8px}
#msgs{flex:1;overflow-y:auto;padding:0 14px 10px;display:flex;flex-direction:column;gap:8px}
.msg{background:var(--panel2);border-radius:8px;padding:7px 10px;font-size:13px}
.msg .who{font-size:11px;font-weight:700;color:var(--accent);margin-bottom:2px}
.msg.me .who{color:var(--blue)}
.msg .when{color:var(--dim);font-weight:400;float:right;font-size:10px}
#chatform{display:flex;gap:7px;padding:12px;border-top:1px solid var(--border)}
#chatform input{flex:1;background:var(--panel2);border:1px solid var(--border);border-radius:7px;padding:8px 10px;color:var(--txt);font-size:13px}
#chatform button{background:var(--accent)}
#keygate{position:fixed;inset:0;background:var(--bg);display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;z-index:50}
#keygate input{background:var(--panel2);border:1px solid var(--border);border-radius:7px;padding:10px 14px;color:var(--txt);width:300px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--border);padding:9px 16px;border-radius:8px;font-size:13px;display:none}
</style>
</head>
<body>
<div id="keygate"><div style="font-size:16px;font-weight:700">Wyld Agent HQ</div><input id="keyin" type="password" placeholder="access key"><button style="background:var(--accent)" onclick="saveKey()">Enter</button></div>
<header>
  <h1>🏢 Wyld Agent HQ</h1><span class="sub" id="gen"></span>
  <div class="right"><span id="statdot" class="dot"></span><span id="stattxt">connecting…</span></div>
</header>
<main>
  <nav id="org"><h2>Departments</h2><div id="orgtree"></div></nav>
  <section id="board"></section>
  <aside id="chat"><h2>HQ Chat (Emma)</h2><div id="msgs"></div>
    <form id="chatform" onsubmit="return sendMsg(event)">
      <input id="chatin" placeholder="Message Emma…" autocomplete="off"><button>Send</button>
    </form>
  </aside>
</main>
<div class="toast" id="toast"></div>
<script>
const EP = "https://emmalindsay--b46b3528cd8a11f1b2291607ee4eb77e.web.val.run";
const STAGE_LABELS = {queued:"Queued",working:"Working",checking:"Checker QC",lead_review:"Lead Review",ready:"Ready for Devon",approved:"Approved",sent_back:"Sent Back"};
const DEPT_NAMES = {ads:"Ads",cs:"CS",images:"Images",outreach:"Outreach"};
const dn = d => DEPT_NAMES[d]||d;
let KEY = localStorage.getItem("ahq_key") || "";
if (location.hash.startsWith("#k=")) { KEY = location.hash.slice(3); localStorage.setItem("ahq_key", KEY); history.replaceState(null,"",location.pathname); }
if (!KEY) document.getElementById("keygate").style.display = "flex";
function saveKey(){ const v=document.getElementById("keyin").value.trim(); if(!v)return; KEY=v; localStorage.setItem("ahq_key",v); document.getElementById("keygate").style.display="none"; tick(); }

async function relay(action, params={}, body=null){
  const qs = new URLSearchParams({k:KEY, action, ...params});
  const r = await fetch(`${EP}/?${qs}`, body ? {method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)} : {});
  if(!r.ok) throw new Error(r.status);
  return r.json();
}
function toast(t){ const el=document.getElementById("toast"); el.textContent=t; el.style.display="block"; setTimeout(()=>el.style.display="none",2500); }
function esc(s){ return String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function ago(ts){ const d=(Date.now()-new Date(ts+(ts.includes("Z")||ts.includes("+")?"":"-07:00")).getTime())/60000;
  if(d<1)return"now"; if(d<60)return Math.round(d)+"m"; if(d<1440)return Math.round(d/60)+"h"; return Math.round(d/1440)+"d"; }

function renderOrg(org){
  document.getElementById("orgtree").innerHTML = Object.entries(org).map(([dept,roles])=>`
    <div class="dept"><div class="dname">${esc(dn(dept))}</div>
    ${roles.map(r=>`<div class="role">${esc(r.title)}<span class="badge ${r.model}">${r.model==="grok"?"GROK":"CLAUDE"}</span></div>`).join("")}
    </div>`).join("");
}
function renderBoard(jobs, stages){
  const pipeline = stages.filter(s=>s!=="approved"&&s!=="sent_back"&&s!=="ready");
  const show = ["ready", ...pipeline];
  const done = jobs.filter(j=>j.stage==="approved"||j.stage==="sent_back");
  const col = s => {
    const js = jobs.filter(j=>j.stage===s);
    return `<div class="col s-${s}"><h3>${STAGE_LABELS[s]||s}<span class="cnt">${js.length}</span></h3>
      ${js.map(j=>`<div class="card"><div class="t">${esc(j.title)}</div>
        <div class="m"><span>${esc(dn(j.dept))}</span>·<span class="badge ${j.model}">${j.model==="grok"?"GROK":"CLAUDE"}</span>·<span>${ago(j.updated)}</span></div>
        ${j.detail?`<div class="d">${esc(j.detail)}</div>`:""}
        ${s==="ready"?`<div class="btns"><button class="approve" onclick="decide(${j.id},'approve')">✓ Approve</button><button class="sendback" onclick="decide(${j.id},'send_back')">↩ Send Back</button></div>`:""}
      </div>`).join("") || `<div style="color:var(--dim);font-size:12px;padding:4px">—</div>`}
    </div>`;
  };
  document.getElementById("board").innerHTML = show.map(col).join("") +
    `<div class="col"><h3>Done<span class="cnt">${done.length}</span></h3>${done.slice(0,8).map(j=>
      `<div class="card" style="opacity:.6"><div class="t">${j.stage==="approved"?"✅":"↩️"} ${esc(j.title)}</div><div class="m">${esc(dn(j.dept))} · ${ago(j.updated)}</div></div>`).join("")}</div>`;
}
async function decide(id, what){
  const note = what==="send_back" ? (prompt("What needs fixing?")||"") : "";
  if(what==="send_back" && !note) return;
  try{ await relay("queue",{},{kind:"decision",payload:{job_id:id,decision:what,note}});
    toast(what==="approve"?"✅ Approved — Emma will action it":"↩ Sent back with your note"); setTimeout(tick,1500);
  }catch(e){ toast("Failed — check connection"); }
}
async function sendMsg(ev){
  ev.preventDefault();
  const inp=document.getElementById("chatin"); const t=inp.value.trim(); if(!t)return false;
  inp.value="";
  try{ await relay("send",{},{room:"hq",sender:"Devon",text:t}); loadChat(); }catch(e){ toast("Send failed"); }
  return false;
}
async function loadChat(){
  const r = await relay("poll",{room:"hq",limit:40});
  const msgs = r.msgs||r.messages||[];
  document.getElementById("msgs").innerHTML = msgs.map(m=>
    `<div class="msg ${m.sender==="Devon"?"me":""}"><div class="who">${esc(m.sender)}<span class="when">${ago(m.ts)}</span></div>${esc(m.text)}</div>`).join("");
  const el=document.getElementById("msgs"); el.scrollTop=el.scrollHeight;
}
async function tick(){
  if(!KEY) return;
  try{
    const st = await relay("kvget",{key:"state"});
    const state = st.value || st;
    renderOrg(state.org||{}); renderBoard(state.jobs||[], state.stages||Object.keys(STAGE_LABELS));
    document.getElementById("gen").textContent = "updated "+ago(state.generated);
    document.getElementById("statdot").className="dot ok"; document.getElementById("stattxt").textContent="live";
    loadChat();
  }catch(e){
    document.getElementById("statdot").className="dot"; document.getElementById("stattxt").textContent="offline";
    if(String(e).includes("401")||String(e).includes("403")) document.getElementById("keygate").style.display="flex";
  }
}
tick(); setInterval(tick, 20000);
</script>
</body>
</html>
